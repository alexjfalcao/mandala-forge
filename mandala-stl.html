<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandala STL — gerador paramétrico</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a22; --panel2:#1e222c; --line:#2a2f3c;
    --txt:#e6e9f0; --dim:#98a0b3; --acc:#e0a458; --acc2:#7cc4d8;
    --ok:#6ec48b; --warn:#e0a458; --bad:#e06a5a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  .app{display:flex;height:100vh}

  /* ---------- painel ---------- */
  .panel{
    width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .panel h1{
    font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line);
    letter-spacing:.04em;text-transform:uppercase;color:var(--txt);font-weight:600;
  }
  .panel h1 small{display:block;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;font-size:11px;margin-top:3px}
  .scroll{overflow-y:auto;flex:1;padding:10px 12px 40px}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:#2c3240;border-radius:6px}

  fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:8px 10px 10px;background:var(--panel2)}
  legend{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:0 5px}
  .row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .row>label{flex:0 0 96px;color:var(--dim);font-size:11.5px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:18px}
  .row .num{flex:0 0 56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--txt);font-size:11.5px}
  .row select,.row input[type=number],.row input[type=color]{
    flex:1;background:#12151c;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit;font-size:12px;
  }
  .row input[type=color]{padding:1px;height:26px}
  .row.seg{gap:4px}
  .seg button{
    flex:1;background:#12151c;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:5px 4px;font:inherit;font-size:11.5px;cursor:pointer;
  }
  .seg button.on{background:var(--acc);border-color:var(--acc);color:#20160a;font-weight:600}
  .hint{color:var(--dim);font-size:11px;margin:6px 2px 0}

  /* ---------- anéis ---------- */
  .ring{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel2);overflow:hidden}
  .ring.off{opacity:.5}
  .rhead{display:flex;align-items:center;gap:7px;padding:7px 9px;cursor:pointer;user-select:none;background:#1b1f29}
  .rhead .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 8px}
  .ring.off .rhead .dot{background:#4a5266}
  .rhead .name{flex:1;font-size:12px}
  .rhead .meta{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
  .rhead .chev{color:var(--dim);transition:transform .15s;font-size:10px}
  .ring.open .chev{transform:rotate(90deg)}
  .rbody{display:none;padding:4px 9px 9px;border-top:1px solid var(--line)}
  .ring.open .rbody{display:block}
  .icon{background:none;border:none;color:var(--dim);cursor:pointer;font-size:13px;padding:0 3px;line-height:1}
  .icon:hover{color:var(--txt)}
  .addring{width:100%;background:#12151c;border:1px dashed var(--line);color:var(--dim);border-radius:8px;padding:8px;cursor:pointer;font:inherit}
  .addring:hover{color:var(--txt);border-color:var(--acc)}

  /* ---------- área principal ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{
    display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;
  }
  .bar .sp{flex:1}
  .tab{background:#12151c;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
  .tab.on{background:var(--panel2);color:var(--txt);border-color:var(--acc)}
  .preset{background:#12151c;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:4px 11px;cursor:pointer;font:inherit;font-size:11.5px}
  .preset:hover{color:var(--txt);border-color:var(--acc2)}
  .stage{flex:1;position:relative;background:
     radial-gradient(circle at 50% 45%, #1b1f29 0%, #0d0f14 70%);min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}
  .foot{
    display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);
    background:var(--panel);flex-wrap:wrap;
  }
  .stat{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
  .stat b{color:var(--txt);font-weight:600}
  .badge{padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid}
  .badge.ok{color:var(--ok);border-color:#2f4f3c;background:#152119}
  .badge.warn{color:var(--warn);border-color:#4f402a;background:#211b12}
  .btn{
    background:var(--acc);color:#20160a;border:none;border-radius:6px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6;cursor:progress}
  .btn.ghost{background:#12151c;color:var(--dim);border:1px solid var(--line);font-weight:400}
  .btn.ghost:hover{color:var(--txt)}
  .hud{
    position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:11px;
    background:rgba(12,14,19,.65);padding:4px 9px;border-radius:5px;pointer-events:none
  }
  @media (max-width:860px){
    .app{flex-direction:column}
    .panel{width:100%;flex:0 0 46vh}
    main{flex:1}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Mandala STL<small>gerador paramétrico para impressão 3D</small></h1>
    <div class="scroll" id="scroll">

      <fieldset>
        <legend>Geral</legend>
        <div class="row"><label>Diâmetro</label><input type="range" data-g="diam" min="40" max="300" step="1"><span class="num" data-v="diam"></span></div>
        <div class="row"><label>Base</label><input type="range" data-g="base" min="0.6" max="8" step="0.1"><span class="num" data-v="base"></span></div>
        <div class="row"><label>Relevo</label><input type="range" data-g="relief" min="0" max="15" step="0.1"><span class="num" data-v="relief"></span></div>
        <div class="row"><label>Simetria</label><input type="range" data-g="sym" min="3" max="48" step="1"><span class="num" data-v="sym"></span></div>
        <div class="row"><label>Rotação</label><input type="range" data-g="rot" min="0" max="360" step="1"><span class="num" data-v="rot"></span></div>
      </fieldset>

      <fieldset>
        <legend>Corpo</legend>
        <div class="row seg">
          <button data-mode="relevo">Relevo sólido</button>
          <button data-mode="vazado">Vazado</button>
        </div>
        <div class="row" data-only="vazado"><label>Limiar</label><input type="range" data-g="thresh" min="0.05" max="0.9" step="0.01"><span class="num" data-v="thresh"></span></div>
        <div class="row" data-only="vazado"><label>Aro externo</label><input type="range" data-g="rim" min="0" max="12" step="0.2"><span class="num" data-v="rim"></span></div>
        <div class="row" data-only="vazado"><label>Conectores</label><input type="range" data-g="conn" min="0" max="36" step="1"><span class="num" data-v="conn"></span></div>
        <div class="row" data-only="vazado"><label>Largura</label><input type="range" data-g="connW" min="0.6" max="6" step="0.1"><span class="num" data-v="connW"></span></div>
        <div class="row"><label>Furo central</label><input type="range" data-g="hole" min="0" max="60" step="0.5"><span class="num" data-v="hole"></span></div>
        <div class="row"><label>Pendurar</label><input type="checkbox" data-g="hang"><span class="num"></span></div>
        <div class="row" data-only="hang"><label>Ø do furo</label><input type="range" data-g="hangD" min="2" max="10" step="0.5"><span class="num" data-v="hangD"></span></div>
        <p class="hint" data-only="vazado">No vazado, o aro externo e os conectores radiais é que seguram a peça inteira. Se o rodapé acusar “peças soltas”, aumente os conectores.</p>
      </fieldset>

      <fieldset>
        <legend>Anéis</legend>
        <div id="rings"></div>
        <button class="addring" id="addring">+ adicionar anel</button>
      </fieldset>

      <fieldset>
        <legend>Preview</legend>
        <div class="row"><label>Cor</label><input type="color" data-g="color"></div>
        <div class="row"><label>Luz</label><input type="range" data-g="light" min="0" max="360" step="1"><span class="num" data-v="light"></span></div>
      </fieldset>
    </div>
  </aside>

  <main>
    <div class="bar">
      <button class="tab on" data-tab="topo">Topo</button>
      <button class="tab" data-tab="v3d">3D</button>
      <span class="sp"></span>
      <button class="preset" data-preset="roseta">roseta</button>
      <button class="preset" data-preset="sol">sol</button>
      <button class="preset" data-preset="vitral">vitral</button>
      <button class="preset" data-preset="flor">flor</button>
      <button class="preset" data-preset="labirinto">labirinto</button>
      <button class="preset" data-preset="random">aleatório</button>
    </div>

    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="hud" id="hud"></div>
    </div>

    <div class="foot">
      <span class="stat">Ø <b id="s-diam"></b> · altura <b id="s-h"></b></span>
      <span class="stat">malha <b id="s-tri"></b> · <b id="s-size"></b></span>
      <span class="badge ok" id="s-parts">1 peça</span>
      <span class="sp" style="flex:1"></span>
      <select id="qual" style="background:#12151c;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit;font-size:12px">
        <option value="teste">qualidade: teste</option>
        <option value="bom" selected>qualidade: boa</option>
        <option value="alta">qualidade: alta</option>
        <option value="max">qualidade: máxima</option>
      </select>
      <button class="btn ghost" id="save">salvar .json</button>
      <button class="btn ghost" id="load">abrir .json</button>
      <button class="btn" id="dl">Baixar STL</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </main>
</div>

<script id="mandala-core">
/* =========================================================================
   NÚCLEO — matemática da mandala, geração de malha e exportação STL.
   Sem qualquer dependência de DOM (é testável fora do navegador).
   ========================================================================= */
var MD = (function () {
  'use strict';
  var TAU = Math.PI * 2, PI = Math.PI;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  var TYPES = [
    ['anel', 'Anel'], ['petalas', 'Pétalas'], ['estrela', 'Estrela'],
    ['dentes', 'Dentes'], ['poligono', 'Polígono'], ['raios', 'Raios'], ['pontos', 'Pontos']
  ];

  function ring(o) {
    var r = {
      on: true, type: 'petalas', outline: false, mult: 1,
      r0: 0.20, r1: 0.55, amp: 0.8, phase: 0,
      w: 0.03, size: 0.8, soft: 0.02, profile: 'domo', h: 0.8
    };
    for (var k in (o || {})) r[k] = o[k];
    return r;
  }

  function defaults() {
    return {
      diam: 120, base: 2, relief: 3.5, sym: 12, rot: 0,
      mode: 'relevo', thresh: 0.35, rim: 3, conn: 0, connW: 1.6,
      hole: 0, hang: false, hangD: 4,
      color: '#d8b26a', light: 315,
      rings: [
        ring({ type: 'anel', outline: true, mult: 1, r0: 0.08, r1: 0.16, w: 0.035, soft: 0.03, profile: 'domo', h: 0.55 }),
        ring({ type: 'petalas', outline: false, mult: 1, r0: 0.16, r1: 0.46, amp: 0.85, soft: 0.05, profile: 'domo', h: 0.9 }),
        ring({ type: 'pontos', outline: false, mult: 2, r0: 0.46, r1: 0.60, size: 0.55, soft: 0.02, profile: 'domo', h: 0.7 }),
        ring({ type: 'petalas', outline: true, mult: 2, r0: 0.58, r1: 0.86, amp: 0.7, w: 0.028, soft: 0.02, profile: 'plano', h: 0.8 }),
        ring({ type: 'anel', outline: true, mult: 1, r0: 0.86, r1: 0.99, w: 0.030, soft: 0.02, profile: 'bisel', h: 0.65 })
      ]
    };
  }

  /* ---- utilidades de onda ---- */
  function tri(x) { return (2 / PI) * Math.asin(Math.sin(x)); }        // dente de serra simétrico [-1,1]
  function sq(x) { return Math.tanh(6 * Math.sin(x)); }                 // quadrada suavizada [-1,1]
  function polyR(a, n) {                                                // raio de um n-gono regular
    var p = TAU / n, d = a - Math.floor(a / p) * p;
    return Math.cos(PI / n) / Math.cos(d - PI / n);
  }
  function angDist(a, n) {                                              // distância angular ao raio mais próximo
    var p = TAU / n, d = a - Math.floor(a / p) * p;
    return d > p / 2 ? d - p : d;
  }

  /* ---- pré-processamento (uma vez por quadro / por malha) ---- */
  function prepare(cfg) {
    var out = [], i;
    for (i = 0; i < cfg.rings.length; i++) {
      var r = cfg.rings[i];
      if (!r.on || r.h === 0) continue;
      var r0 = Math.min(r.r0, r.r1), r1 = Math.max(r.r0, r.r1);
      if (r1 - r0 < 1e-4) continue;
      var n = Math.max(1, Math.round(cfg.sym * r.mult));
      var mid = (r0 + r1) / 2, half = (r1 - r0) / 2;
      var soft = Math.max(0.002, r.soft);
      var w = Math.max(0.004, r.w);
      var span = Math.min(half, PI * mid / n);         // meia-largura útil de um setor
      var g = {
        type: r.type, outline: !!r.outline, n: n,
        ph: (r.phase + cfg.rot) * PI / 180,
        r0: r0, r1: r1, mid: mid, half: half,
        amp: r.amp, soft: soft, w: w,
        dot: Math.max(0.004, span * r.size),
        arc: Math.max(0.004, span * r.size),
        profile: r.profile, h: r.h
      };
      var pad = soft + (g.outline ? w : 0) + 0.005;
      g.lo = r0 - pad; g.hi = r1 + pad;
      out.push(g);
    }
    return { rings: out };
  }

  /* ---- campo de um anel: retorna 0..1 ---- */
  function shape(g, r, th) {
    if (r < g.lo || r > g.hi) return 0;
    var a = th + g.ph, s, R, d;
    switch (g.type) {
      case 'anel':
        s = g.outline ? (g.w - Math.abs(r - g.mid)) : Math.min(g.r1 - r, r - g.r0);
        break;
      case 'petalas':
        R = g.mid + g.amp * g.half * Math.cos(g.n * a);
        s = g.outline ? (g.w - Math.abs(R - r)) : Math.min(R - r, r - g.r0);
        break;
      case 'estrela':
        R = g.mid + g.amp * g.half * tri(g.n * a);
        s = g.outline ? (g.w - Math.abs(R - r)) : Math.min(R - r, r - g.r0);
        break;
      case 'dentes':
        R = g.mid + g.amp * g.half * sq(g.n * a);
        s = g.outline ? (g.w - Math.abs(R - r)) : Math.min(R - r, r - g.r0);
        break;
      case 'poligono':
        R = g.r1 * polyR(a, Math.max(3, g.n));
        s = g.outline ? (g.w - Math.abs(R - r)) : Math.min(R - r, r - g.r0);
        break;
      case 'raios':
        d = Math.min(g.half - Math.abs(r - g.mid), g.arc - Math.abs(angDist(a, g.n)) * r);
        s = g.outline ? (g.w - Math.abs(d)) : d;
        break;
      case 'pontos':
        var dd = Math.abs(angDist(a, g.n));
        var dist = Math.sqrt(Math.max(0, r * r + g.mid * g.mid - 2 * r * g.mid * Math.cos(dd)));
        d = g.dot - dist;
        s = g.outline ? (g.w - Math.abs(d)) : d;
        break;
      default: return 0;
    }
    if (s <= 0) return 0;
    var t = s < g.soft ? s / g.soft : 1;
    if (g.profile === 'domo') return Math.sqrt(Math.max(0, 1 - (1 - t) * (1 - t)));
    if (g.profile === 'bisel') return t;
    return t * t * (3 - 2 * t);                                        // plano (bordas suaves)
  }

  /* ---- campo combinado: 0..1 ---- */
  function field(P, r, th) {
    var pos = 0, neg = 0, R = P.rings, i, g, m, c;
    for (i = 0; i < R.length; i++) {
      g = R[i];
      m = shape(g, r, th);
      if (m <= 0) continue;
      c = g.h * m;
      if (c > 0) { if (c > pos) pos = c; } else neg -= c;
    }
    var v = pos - neg;
    return v < 0 ? 0 : (v > 1 ? 1 : v);
  }

  /* ---- há material neste ponto? (rmm em mm) ---- */
  function solid(cfg, rmm, th, v) {
    var R = cfg.diam / 2;
    if (rmm > R) return false;
    if (cfg.hole > 0 && rmm < cfg.hole / 2) return false;
    if (cfg.hang) {
      var hy = R - (cfg.hangD / 2 + 2.2);
      var dx = rmm * Math.cos(th), dy = rmm * Math.sin(th);
      var d = Math.sqrt(dx * dx + (dy - hy) * (dy - hy));
      if (d < cfg.hangD / 2) return false;
      if (d < cfg.hangD / 2 + 1.7) return true;                        // ilhó sólido em volta
    }
    if (cfg.mode === 'relevo') return true;
    if (cfg.rim > 0 && rmm >= R - cfg.rim) return true;
    if (cfg.conn > 0 && cfg.connW > 0) {                               // barras radiais de ligação
      var n = Math.max(1, Math.round(cfg.conn));
      if (Math.abs(angDist(th + cfg.rot * PI / 180, n)) * rmm < cfg.connW / 2) return true;
    }
    return v > cfg.thresh;
  }

  /* ---- resolução por qualidade (angular múltipla da simetria) ---- */
  var QUAL = { teste: [120, 480], bom: [220, 720], alta: [320, 1080], max: [420, 1440] };
  function resolution(cfg, q) {
    var p = QUAL[q] || QUAL.bom;
    var sym = Math.max(3, Math.round(cfg.sym));
    var nt = Math.max(sym * 8, Math.round(p[1] / sym) * sym);
    nt = Math.min(nt, 2160);
    return { nr: p[0], nt: nt };
  }

  /* ---- buffer de triângulos ---- */
  function Buf() { this.a = new Float32Array(1 << 17); this.n = 0; }
  Buf.prototype.tri = function (x1, y1, z1, x2, y2, z2, x3, y3, z3) {
    if (this.n + 9 > this.a.length) {
      var b = new Float32Array(this.a.length * 2); b.set(this.a); this.a = b;
    }
    var a = this.a, n = this.n;
    a[n] = x1; a[n + 1] = y1; a[n + 2] = z1;
    a[n + 3] = x2; a[n + 4] = y2; a[n + 5] = z2;
    a[n + 6] = x3; a[n + 7] = y3; a[n + 8] = z3;
    this.n = n + 9;
  };

  /* =======================================================================
     Malha: grade polar de NR x NT células.
     Topo (altura do campo), fundo plano em z=0 e paredes em toda fronteira.
     ======================================================================= */
  function buildMesh(cfg, res) {
    var R = cfg.diam / 2;
    var rIn = cfg.hole > 0 ? cfg.hole / 2 : 0;
    var NR = res.nr, NT = res.nt;
    var P = prepare(cfg);
    var i, j, k;

    var rs = new Float64Array(NR + 1);
    for (i = 0; i <= NR; i++) rs[i] = rIn + (R - rIn) * i / NR;
    var cs = new Float64Array(NT), sn = new Float64Array(NT), ths = new Float64Array(NT);
    for (j = 0; j < NT; j++) { ths[j] = TAU * j / NT; cs[j] = Math.cos(ths[j]); sn[j] = Math.sin(ths[j]); }

    // alturas nos nós
    var z = new Float32Array((NR + 1) * NT);
    for (i = 0; i <= NR; i++) {
      var rn = rs[i] / R;
      for (j = 0; j < NT; j++) z[i * NT + j] = cfg.base + cfg.relief * field(P, rn, ths[j]);
    }
    if (rIn === 0) {                                                   // nó central único
      var acc = 0; for (j = 0; j < NT; j++) acc += z[j];
      acc /= NT; for (j = 0; j < NT; j++) z[j] = acc;
    }

    // presença por célula (avaliada no centro)
    var pres = new Uint8Array(NR * NT);
    var dth = TAU / NT;
    for (i = 0; i < NR; i++) {
      var rc = (rs[i] + rs[i + 1]) / 2, rcn = rc / R;
      for (j = 0; j < NT; j++) {
        var thc = ths[j] + dth / 2;
        pres[i * NT + j] = solid(cfg, rc, thc, field(P, rcn, thc)) ? 1 : 0;
      }
    }

    var B = new Buf();
    var center = (rIn === 0);
    // se a peça for um disco cheio, o fundo vira um leque único (metade dos triângulos)
    var full = true;
    for (i = 0; i < pres.length; i++) if (!pres[i]) { full = false; break; }
    function X(i, j) { return rs[i] * cs[j]; }
    function Y(i, j) { return rs[i] * sn[j]; }
    function Z(i, j) { return z[i * NT + j]; }

    for (i = 0; i < NR; i++) {
      for (j = 0; j < NT; j++) {
        if (!pres[i * NT + j]) continue;
        var jp = (j + 1) % NT, jm = (j - 1 + NT) % NT;
        var ax = X(i, j), ay = Y(i, j), az = Z(i, j);
        var bx = X(i, jp), by = Y(i, jp), bz = Z(i, jp);
        var cx = X(i + 1, jp), cy = Y(i + 1, jp), cz = Z(i + 1, jp);
        var dx = X(i + 1, j), dy = Y(i + 1, j), dz = Z(i + 1, j);
        var atCenter = (i === 0 && center);

        // topo (normal +z, sentido anti-horário visto de cima)
        B.tri(ax, ay, az, dx, dy, dz, cx, cy, cz);
        if (!atCenter) B.tri(ax, ay, az, cx, cy, cz, bx, by, bz);
        // fundo (z=0, invertido) — omitido quando o leque único cobre tudo
        if (!full) {
          B.tri(ax, ay, 0, cx, cy, 0, dx, dy, 0);
          if (!atCenter) B.tri(ax, ay, 0, bx, by, 0, cx, cy, 0);
        }

        // parede interna
        if (!atCenter && (i === 0 || !pres[(i - 1) * NT + j])) {
          B.tri(ax, ay, 0, bx, by, bz, bx, by, 0);
          B.tri(ax, ay, 0, ax, ay, az, bx, by, bz);
        }
        // parede externa
        if (i === NR - 1 || !pres[(i + 1) * NT + j]) {
          B.tri(dx, dy, 0, cx, cy, 0, cx, cy, cz);
          B.tri(dx, dy, 0, cx, cy, cz, dx, dy, dz);
        }
        // parede no lado θ inferior
        if (!pres[i * NT + jm]) {
          B.tri(ax, ay, 0, dx, dy, 0, dx, dy, dz);
          B.tri(ax, ay, 0, dx, dy, dz, ax, ay, az);
        }
        // parede no lado θ superior
        if (!pres[i * NT + jp]) {
          B.tri(bx, by, 0, cx, cy, cz, cx, cy, 0);
          B.tri(bx, by, 0, bx, by, bz, cx, cy, cz);
        }
      }
    }

    if (full) {                                                        // fundo em leque / coroa
      for (j = 0; j < NT; j++) {
        var j2 = (j + 1) % NT;
        var iax = X(0, j), iay = Y(0, j), ibx = X(0, j2), iby = Y(0, j2);
        var ocx = X(NR, j2), ocy = Y(NR, j2), odx = X(NR, j), ody = Y(NR, j);
        B.tri(iax, iay, 0, ocx, ocy, 0, odx, ody, 0);
        if (!center) B.tri(iax, iay, 0, ibx, iby, 0, ocx, ocy, 0);
      }
    }

    var maxZ = 0;
    for (k = 0; k < z.length; k++) if (z[k] > maxZ) maxZ = z[k];
    return {
      pos: B.a, n: B.n, tris: B.n / 9,
      height: maxZ, diam: cfg.diam,
      parts: components(pres, NR, NT, center)
    };
  }

  /* ---- quantas peças separadas? (aviso de impressão) ---- */
  function components(pres, NR, NT, center) {
    var seen = new Uint8Array(NR * NT), stack = [], count = 0, i, j;
    for (i = 0; i < NR; i++) for (j = 0; j < NT; j++) {
      var s = i * NT + j;
      if (!pres[s] || seen[s]) continue;
      count++; seen[s] = 1; stack.push(s);
      while (stack.length) {
        var c = stack.pop(), ci = (c / NT) | 0, cj = c % NT, nb, t;
        nb = [ci * NT + (cj + 1) % NT, ci * NT + (cj - 1 + NT) % NT];
        if (ci > 0) nb.push((ci - 1) * NT + cj);
        if (ci < NR - 1) nb.push((ci + 1) * NT + cj);
        if (ci === 0 && center) for (t = 0; t < NT; t++) nb.push(t);   // tudo se toca no centro
        for (t = 0; t < nb.length; t++) if (pres[nb[t]] && !seen[nb[t]]) { seen[nb[t]] = 1; stack.push(nb[t]); }
      }
    }
    return count;
  }

  /* ---- STL binário ---- */
  function toSTL(mesh, name) {
    var nt = mesh.tris, buf = new ArrayBuffer(84 + 50 * nt), dv = new DataView(buf);
    var head = 'mandala-stl :: ' + (name || 'mandala');
    for (var c = 0; c < 80; c++) dv.setUint8(c, c < head.length ? head.charCodeAt(c) & 0x7f : 32);
    dv.setUint32(80, nt, true);
    var p = mesh.pos, off = 84;
    for (var t = 0; t < nt; t++) {
      var o = t * 9;
      var x1 = p[o], y1 = p[o + 1], z1 = p[o + 2];
      var x2 = p[o + 3], y2 = p[o + 4], z2 = p[o + 5];
      var x3 = p[o + 6], y3 = p[o + 7], z3 = p[o + 8];
      var ux = x2 - x1, uy = y2 - y1, uz = z2 - z1;
      var vx = x3 - x1, vy = y3 - y1, vz = z3 - z1;
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      var L = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      dv.setFloat32(off, nx / L, true); dv.setFloat32(off + 4, ny / L, true); dv.setFloat32(off + 8, nz / L, true);
      dv.setFloat32(off + 12, x1, true); dv.setFloat32(off + 16, y1, true); dv.setFloat32(off + 20, z1, true);
      dv.setFloat32(off + 24, x2, true); dv.setFloat32(off + 28, y2, true); dv.setFloat32(off + 32, z2, true);
      dv.setFloat32(off + 36, x3, true); dv.setFloat32(off + 40, y3, true); dv.setFloat32(off + 44, z3, true);
      dv.setUint16(off + 48, 0, true);
      off += 50;
    }
    return buf;
  }

  /* ---- diagnóstico: malha fechada? (usado nos testes) ---- */
  function audit(mesh) {
    var p = mesh.pos, nt = mesh.tris, map = new Map(), i, k;
    var open = 0, degen = 0, bad = 0;
    function key(o) {
      return (Math.round(p[o] * 1e4) / 1e4) + ',' + (Math.round(p[o + 1] * 1e4) / 1e4) + ',' + (Math.round(p[o + 2] * 1e4) / 1e4);
    }
    for (i = 0; i < nt; i++) {
      var o = i * 9, a = key(o), b = key(o + 3), c = key(o + 6);
      if (!isFinite(p[o]) || !isFinite(p[o + 1]) || !isFinite(p[o + 2])) bad++;
      var ux = p[o + 3] - p[o], uy = p[o + 4] - p[o + 1], uz = p[o + 5] - p[o + 2];
      var vx = p[o + 6] - p[o], vy = p[o + 7] - p[o + 1], vz = p[o + 8] - p[o + 2];
      var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      if (Math.sqrt(nx * nx + ny * ny + nz * nz) < 1e-12) degen++;
      var e = [[a, b], [b, c], [c, a]];
      for (k = 0; k < 3; k++) {
        var f = e[k][0] + '|' + e[k][1], rv = e[k][1] + '|' + e[k][0];
        if (map.get(rv)) map.set(rv, map.get(rv) - 1); else map.set(f, (map.get(f) || 0) + 1);
      }
    }
    map.forEach(function (v) { open += v; });
    return { openEdges: open, degenerate: degen, nonFinite: bad, tris: nt };
  }

  return {
    TYPES: TYPES, ring: ring, defaults: defaults, prepare: prepare,
    field: field, shape: shape, solid: solid, resolution: resolution,
    buildMesh: buildMesh, toSTL: toSTL, audit: audit, clamp: clamp
  };
})();
</script>

    if (el.dataset.outline !== undefined && el.dataset.outline !== '') { cfg.rings[+el.dataset.outline].outline = true; drawPanel(); schedule(); return; }
    var head = el.closest('[data-toggle]');
    if (head && el.tagName !== 'INPUT') { i = +head.dataset.toggle; open[i] = !open[i]; drawPanel(); }
  });
  document.getElementById('addring').addEventListener('click', function () {
    var last = cfg.rings[cfg.rings.length - 1];
    cfg.rings.push(MD.ring({ r0: Math.min(0.9, last ? last.r1 : 0.3), r1: 1 }));
    open = {}; open[cfg.rings.length - 1] = true; drawPanel(); schedule();
  });

  document.querySelectorAll('.preset').forEach(function (b) {
    b.addEventListener('click', function () {
      var keep = { color: cfg.color, light: cfg.light, diam: cfg.diam };
      cfg = PRESETS[b.dataset.preset]();
      cfg.color = keep.color; cfg.light = keep.light; cfg.diam = keep.diam;
      open = {}; drawPanel(); schedule();
    });
  });
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      tab = b.dataset.tab;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('on', x === b); });
      schedule();
    });
  });

  /* ---------------- desenho ---------------- */
  function hex(c) {
    return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)];
  }
  function lightDir() {
    var a = cfg.light * Math.PI / 180;
    var lx = Math.cos(a), ly = Math.sin(a), lz = 0.85;
    var L = Math.sqrt(lx * lx + ly * ly + lz * lz);
    return [lx / L, ly / L, lz / L];
  }

  function fit() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== (w * dpr | 0) || cv.height !== (h * dpr | 0)) {
      cv.width = w * dpr | 0; cv.height = h * dpr | 0;
    }
  }

  /* vista de topo: campo de alturas sombreado pixel a pixel */
  function drawTop(scale) {
    var W = Math.max(64, (cv.width * scale) | 0), H = Math.max(64, (cv.height * scale) | 0);
    var P = MD.prepare(cfg), Rm = cfg.diam / 2;
    var img = ctx.createImageData(W, H), d = img.data;
    var cx = W / 2, cy = H / 2, px = (Rm * 2.16) / Math.min(W, H);   // mm por pixel
    var zb = new Float32Array(W * H), mb = new Uint8Array(W * H);
    var x, y, k;
    for (y = 0; y < H; y++) {
      var my = (y - cy) * px;
      for (x = 0; x < W; x++) {
        var mx = (x - cx) * px;
        var rr = Math.sqrt(mx * mx + my * my);
        k = y * W + x;
        if (rr > Rm) { mb[k] = 0; continue; }
        var th = Math.atan2(my, mx);
        var v = MD.field(P, rr / Rm, th);
        if (!MD.solid(cfg, rr, th, v)) { mb[k] = 0; continue; }
        mb[k] = 1; zb[k] = cfg.base + cfg.relief * v;
      }
    }
    var L = lightDir(), col = hex(cfg.color);
    for (y = 0; y < H; y++) {
      for (x = 0; x < W; x++) {
        k = y * W + x; var o = k * 4;
        if (!mb[k]) { d[o] = 13; d[o + 1] = 15; d[o + 2] = 20; d[o + 3] = 255; continue; }
        var xm = (x > 0 && mb[k - 1]) ? zb[k - 1] : zb[k];
        var xp = (x < W - 1 && mb[k + 1]) ? zb[k + 1] : zb[k];
        var ym = (y > 0 && mb[k - W]) ? zb[k - W] : zb[k];
        var yp = (y < H - 1 && mb[k + W]) ? zb[k + W] : zb[k];
        var gx = (xp - xm) / (2 * px), gy = (yp - ym) / (2 * px);
        var nx = -gx, ny = -gy, nz = 1, NL = Math.sqrt(nx * nx + ny * ny + 1);
        nx /= NL; ny /= NL; nz /= NL;
        var dif = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        var hx = L[0], hy2 = L[1], hz = L[2] + 1, HL = Math.sqrt(hx * hx + hy2 * hy2 + hz * hz);
        var spec = Math.pow(Math.max(0, (nx * hx + ny * hy2 + nz * hz) / HL), 26) * 0.5;
        var amb = 0.26 + 0.14 * (zb[k] / (cfg.base + cfg.relief + 0.001));
        var f = amb + 0.78 * dif;
        // contorno escuro junto às bordas vazadas
        var edge = (x > 0 && !mb[k - 1]) || (x < W - 1 && !mb[k + 1]) || (y > 0 && !mb[k - W]) || (y < H - 1 && !mb[k + W]) ? 0.55 : 1;
        d[o] = MD.clamp(col[0] * f * edge + spec * 255, 0, 255);
        d[o + 1] = MD.clamp(col[1] * f * edge + spec * 255, 0, 255);
        d[o + 2] = MD.clamp(col[2] * f * edge + spec * 255, 0, 255);
        d[o + 3] = 255;
      }
    }
    if (scale === 1) ctx.putImageData(img, 0, 0);
    else {
      var tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
      tmp.getContext('2d').putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(tmp, 0, 0, cv.width, cv.height);
    }
  }

  /* vista 3D: grade cartesiana desenhada do fundo para a frente */
  function draw3D(G) {
    var W = cv.width, H = cv.height;
    ctx.fillStyle = '#0d0f14'; ctx.fillRect(0, 0, W, H);
    var P = MD.prepare(cfg), Rm = cfg.diam / 2;
    var N = G + 1, step = (Rm * 2) / G;
    var z = new Float32Array(N * N), m = new Uint8Array(G * G);
    var i, j;
    for (j = 0; j < N; j++) {
      var yy = -Rm + j * step;
      for (i = 0; i < N; i++) {
        var xx = -Rm + i * step;
        var rr = Math.sqrt(xx * xx + yy * yy);
        z[j * N + i] = cfg.base + cfg.relief * (rr <= Rm ? MD.field(P, rr / Rm, Math.atan2(yy, xx)) : 0);
      }
    }
    for (j = 0; j < G; j++) {
      var ym = -Rm + (j + 0.5) * step;
      for (i = 0; i < G; i++) {
        var xm = -Rm + (i + 0.5) * step;
        var r2 = Math.sqrt(xm * xm + ym * ym);
        m[j * G + i] = (r2 <= Rm && MD.solid(cfg, r2, Math.atan2(ym, xm), MD.field(P, r2 / Rm, Math.atan2(ym, xm)))) ? 1 : 0;
      }
    }
    var cy = Math.cos(yaw), sy = Math.sin(yaw), se = Math.sin(elev), ce = Math.cos(elev);
    var sc = Math.min(W, H) * 0.42 / Rm, ox = W / 2, oy = H / 2 + Rm * sc * 0.10;
    function proj(x, y, zz) {
      var X = x * cy - y * sy, Y = x * sy + y * cy;
      return [ox + X * sc, oy + (Y * se - zz * ce) * sc, Y * ce + zz * se];
    }
    var L = lightDir(), col = hex(cfg.color);
    var wallCol = 'rgb(' + (col[0] * 0.30 | 0) + ',' + (col[1] * 0.30 | 0) + ',' + (col[2] * 0.30 | 0) + ')';
    var items = [], k = 0;
    for (j = 0; j < G; j++) for (i = 0; i < G; i++) {
      if (!m[j * G + i]) continue;
      var x0 = -Rm + i * step, y0 = -Rm + j * step, x1 = x0 + step, y1 = y0 + step;
      var za = z[j * N + i], zb2 = z[j * N + i + 1], zc = z[(j + 1) * N + i + 1], zd = z[(j + 1) * N + i];
      var p1 = proj(x0, y0, za), p2 = proj(x1, y0, zb2), p3 = proj(x1, y1, zc), p4 = proj(x0, y1, zd);
      var gx = ((zb2 + zc) - (za + zd)) / (2 * step), gy = ((zd + zc) - (za + zb2)) / (2 * step);
      var nx = -gx / Math.sqrt(gx * gx + gy * gy + 1), ny = -gy / Math.sqrt(gx * gx + gy * gy + 1);
      var nz = 1 / Math.sqrt(gx * gx + gy * gy + 1);
      var dif = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
      var hx = L[0], hy = L[1], hz = L[2] + 1, HL = Math.sqrt(hx * hx + hy * hy + hz * hz);
      var spec = Math.pow(Math.max(0, (nx * hx + ny * hy + nz * hz) / HL), 22) * 90;
      var f = 0.32 + 0.72 * dif;
      items.push({
        d: (p1[2] + p3[2]) / 2, p: [p1, p2, p3, p4],
        c: 'rgb(' + MD.clamp(col[0] * f + spec, 0, 255).toFixed(0) + ',' +
          MD.clamp(col[1] * f + spec, 0, 255).toFixed(0) + ',' +
          MD.clamp(col[2] * f + spec, 0, 255).toFixed(0) + ')'
      });
      // saias verticais nas fronteiras (do topo até z = 0)
      var nb = [
        [i - 1, j, x0, y0, za, x0, y1, zd],
        [i + 1, j, x1, y0, zb2, x1, y1, zc],
        [i, j - 1, x0, y0, za, x1, y0, zb2],
        [i, j + 1, x0, y1, zd, x1, y1, zc]
      ];
      for (k = 0; k < 4; k++) {
        var e = nb[k], ni = e[0], nj = e[1];
        if (!(ni < 0 || nj < 0 || ni >= G || nj >= G || !m[nj * G + ni])) continue;
        var t1 = proj(e[2], e[3], e[4]), t2 = proj(e[5], e[6], e[7]);
        var b1 = proj(e[2], e[3], 0), b2 = proj(e[5], e[6], 0);
        items.push({ d: Math.max(t1[2], t2[2], b1[2], b2[2]) - 1e-4, p: [t1, t2, b2, b1], c: wallCol });
      }
    }
    items.sort(function (a, b) { return a.d - b.d; });
    for (k = 0; k < items.length; k++) {
      var it = items[k], p = it.p;
      ctx.fillStyle = it.c; ctx.strokeStyle = it.c; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p[0][0], p[0][1]); ctx.lineTo(p[1][0], p[1][1]);
      ctx.lineTo(p[2][0], p[2][1]); ctx.lineTo(p[3][0], p[3][1]);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }

  /* ---------------- agendamento do preview ---------------- */
  function schedule() {
    lowRes = true;
    if (!pending) { pending = true; requestAnimationFrame(function () { pending = false; render(0.42); }); }
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { lowRes = false; render(1); updateStats(); }, 180);
  }
  function render(scale) {
    fit();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (tab === 'topo') drawTop(scale);
    else draw3D(scale < 1 ? 72 : 200);
    hud.textContent = tab === 'topo'
      ? 'vista de topo — arraste a luz com o controle "Luz"'
      : 'arraste para girar · ' + Math.round(yaw * 180 / Math.PI) + '° / ' + Math.round(elev * 180 / Math.PI) + '°';
  }

  /* ---------------- estatísticas ---------------- */
  function updateStats() {
    var P = MD.prepare(cfg), Rm = cfg.diam / 2, rIn = cfg.hole > 0 ? cfg.hole / 2 : 0;
    var full = MD.resolution(cfg, document.getElementById('qual').value);
    // mesma resolução angular da exportação: é ela que decide se a peça fica inteira
    var NR = Math.min(120, full.nr), NT = full.nt;
    var pres = new Uint8Array(NR * NT), count = 0, i, j;
    for (i = 0; i < NR; i++) {
      var rc = rIn + (Rm - rIn) * (i + 0.5) / NR;
      for (j = 0; j < NT; j++) {
        var th = Math.PI * 2 * (j + 0.5) / NT;
        var s = MD.solid(cfg, rc, th, MD.field(P, rc / Rm, th)) ? 1 : 0;
        pres[i * NT + j] = s; count += s;
      }
    }
    var parts = componentsUI(pres, NR, NT, rIn === 0);
    var frac = count / (NR * NT);
    var estTri = Math.round(full.nr * full.nt * frac * 4 * 1.18);
    document.getElementById('s-diam').textContent = cfg.diam + ' mm';
    document.getElementById('s-h').textContent = (cfg.base + cfg.relief).toFixed(1) + ' mm';
    document.getElementById('s-tri').textContent = fmtN(estTri) + ' tri (≈)';
    document.getElementById('s-size').textContent = fmtB(84 + estTri * 50);
    var badge = document.getElementById('s-parts');
    badge.textContent = parts === 1 ? '1 peça' : parts + ' peças soltas';
    badge.className = 'badge ' + (parts === 1 ? 'ok' : 'warn');
  }
  function componentsUI(pres, NR, NT, center) {
    var seen = new Uint8Array(NR * NT), st = [], c = 0, i, j;
    for (i = 0; i < NR; i++) for (j = 0; j < NT; j++) {
      var s = i * NT + j;
      if (!pres[s] || seen[s]) continue;
      c++; seen[s] = 1; st.push(s);
      while (st.length) {
        var q = st.pop(), qi = (q / NT) | 0, qj = q % NT, nb = [qi * NT + (qj + 1) % NT, qi * NT + (qj - 1 + NT) % NT], t;
        if (qi > 0) nb.push((qi - 1) * NT + qj);
        if (qi < NR - 1) nb.push((qi + 1) * NT + qj);
        if (qi === 0 && center) for (t = 0; t < NT; t++) nb.push(t);
        for (t = 0; t < nb.length; t++) if (pres[nb[t]] && !seen[nb[t]]) { seen[nb[t]] = 1; st.push(nb[t]); }
      }
    }
    return c;
  }
  function fmtN(n) { return n.toLocaleString('pt-BR'); }
  function fmtB(b) { return b > 1e6 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' kB'; }

  /* ---------------- órbita 3D ---------------- */
  var drag = null;
  cv.addEventListener('pointerdown', function (e) {
    if (tab !== 'v3d') return;
    drag = { x: e.clientX, y: e.clientY, yaw: yaw, el: elev };
    cv.setPointerCapture(e.pointerId); cv.classList.add('drag');
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    yaw = drag.yaw + (e.clientX - drag.x) * 0.008;
    elev = MD.clamp(drag.el + (e.clientY - drag.y) * 0.006, 0.18, 1.53);
    render(0.5);
  });
  cv.addEventListener('pointerup', function (e) {
    if (!drag) return;
    drag = null; cv.classList.remove('drag'); render(1);
  });

  /* ---------------- exportação ---------------- */
  function download(blob, name) {
    var u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(u); a.remove(); }, 500);
  }
  document.getElementById('dl').addEventListener('click', function () {
    var btn = this; btn.disabled = true; btn.textContent = 'gerando…';
    setTimeout(function () {
      try {
        var res = MD.resolution(cfg, document.getElementById('qual').value);
        var mesh = MD.buildMesh(cfg, res);
        var buf = MD.toSTL(mesh, 'mandala');
        download(new Blob([buf], { type: 'model/stl' }),
          'mandala_' + cfg.sym + 'x_' + cfg.diam + 'mm.stl');
        document.getElementById('s-tri').textContent = fmtN(mesh.tris) + ' tri';
        document.getElementById('s-size').textContent = fmtB(buf.byteLength);
        var badge = document.getElementById('s-parts');
        badge.textContent = mesh.parts === 1 ? '1 peça' : mesh.parts + ' peças soltas';
        badge.className = 'badge ' + (mesh.parts === 1 ? 'ok' : 'warn');
      } catch (err) {
        alert('Não consegui gerar a malha: ' + err.message + '\nTente uma qualidade menor.');
      }
      btn.disabled = false; btn.textContent = 'Baixar STL';
    }, 30);
  });
  document.getElementById('save').addEventListener('click', function () {
    download(new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' }), 'mandala.json');
  });
  document.getElementById('load').addEventListener('click', function () { document.getElementById('file').click(); });
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var o = JSON.parse(rd.result);
        if (!o.rings || !o.rings.length) throw new Error('sem anéis');
        cfg = Object.assign(MD.defaults(), o);
        open = {}; drawPanel(); schedule();
      } catch (err) { alert('Arquivo inválido: ' + err.message); }
    };
    rd.readAsText(f); e.target.value = '';
  });
  document.getElementById('qual').addEventListener('change', updateStats);

  window.addEventListener('resize', function () { schedule(); });

  drawPanel();
  schedule();
})();
</script>
</body>
</html>
