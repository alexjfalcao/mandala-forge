<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandala Forge — gerador de mandala em filete e esmalte</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a22; --panel2:#1e222c; --line:#2a2f3c;
    --txt:#e6e9f0; --dim:#98a0b3;
    /* Acento em champanhe, e não no violeta que vinha antes. Vem do assunto:
       cloisonné é fio de metal represando esmalte, e o metal aqui é gilt
       envelhecido. Crômática baixa de propósito, porque o CONTEÚDO desta tela é
       a mandala colorida: o cromo precisa recuar para ela ler. O que faz parecer
       caro é a temperatura quente contra o quase-preto frio dos neutros, que
       ficam como estavam, não a saturação. */
    --acc:#d2c2a4; --acc2:#ada490; --on-acc:#17140c;
    --ok:#6ec48b; --warn:#e0a458; --bad:#e06a5a;
    /* Três degraus, não cinco. O painel tinha 10/11/11.5/12/14px espremidos em
       4px de amplitude, o que é o mesmo que não ter hierarquia. Aqui: miúdo
       (rótulo de apoio, aviso, badge), corrente (todo controle) e título. */
    --fs-sm:11px; --fs:12.5px; --fs-lg:15.5px;
  }
  *{box-sizing:border-box}
  /* As superfícies que o navegador desenha sozinho também são a interface. Sem
     isto o checkbox sai azul de fábrica e a seleção de texto sai azul-sistema,
     no meio de uma tela que não tem azul nenhum. */
  html{accent-color:var(--acc)}
  ::selection{background:var(--acc);color:var(--on-acc)}
  input,textarea{caret-color:var(--acc)}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--txt);
    font:var(--fs)/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  /* Sem isso os controles caem no 13.333px do agente de usuário e reintroduzem
     um quarto tamanho, invisível na tela mas real na folha de estilo. */
  input,button,select,textarea{font-family:inherit;font-size:inherit}
  /* Um anel de foco desenhado, e só no teclado. O padrão do agente de usuário é
     azul e briga com o acento; pior, `outline:none` solto pelo CSS apagava o
     anel em alguns campos sem pôr nada no lugar. */
  :focus-visible{outline:2px solid var(--acc2);outline-offset:2px;border-radius:4px}
  .app{display:flex;height:100vh}

  /* ---------- painel ---------- */
  .panel{
    width:352px;flex:0 0 352px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;
  }
  .panel h1{
    font-size:var(--fs-lg);margin:0;padding:14px 16px;border-bottom:1px solid var(--line);
    letter-spacing:.04em;text-transform:uppercase;font-weight:600;
    display:flex;align-items:flex-start;gap:10px;
  }
  .panel h1 .titulo{flex:1;min-width:0}
  .panel h1 small{text-wrap:balance}
  /* Bandeiras desenhadas em SVG, não emoji: 🇧🇷 e 🇺🇸 não renderizam no Windows,
     onde o Chrome cai para as letras "BR" e "US". */
  .idiomas{display:flex;gap:5px;flex:0 0 auto;padding-top:1px}
  .idiomas button{
    width:26px;height:19px;padding:0;background:none;border:1px solid var(--line);
    border-radius:3px;cursor:pointer;line-height:0;overflow:hidden;opacity:.45;
    transition:opacity .15s cubic-bezier(.16,1,.3,1),border-color .15s;
  }
  .idiomas button svg{width:100%;height:100%;display:block}
  .idiomas button:hover{opacity:.85}
  .idiomas button[aria-pressed=true]{opacity:1;border-color:var(--acc)}
  @media (prefers-reduced-motion:reduce){ .idiomas button{transition:none} }
  .panel h1 small{display:block;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:400;font-size:var(--fs-sm);margin-top:3px}
  .scroll{overflow-y:auto;flex:1;padding:10px 12px 40px}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:#33394a;border-radius:6px}
  .scroll::-webkit-scrollbar-thumb:hover{background:#414962}

  /* min-width:0 é obrigatório: o UA dá `min-inline-size:min-content` ao fieldset,
     e a largura intrínseca do input[type=range] o faria estourar o painel */
  fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:8px 10px 10px;background:var(--panel2);min-width:0}
  legend{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);padding:0 5px}
  .row{display:flex;align-items:center;gap:6px;margin:6px 0}
  .row>label{flex:0 0 86px;color:var(--dim);font-size:var(--fs)}
  .row input[type=range]{flex:1;min-width:0;height:18px}
  .row .num{flex:0 0 54px;text-align:right;font-variant-numeric:tabular-nums;font-size:var(--fs)}
  .row select,.row input[type=number],.row input[type=text]:not(.hexin){
    flex:1;background:#12151c;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit;font-size:var(--fs);
  }
  .row input[type=color]{width:34px;height:24px;padding:1px;background:#12151c;border:1px solid var(--line);border-radius:5px}
  /* botões de passo fino, injetados ao redor de cada slider por decoraControles() */
  .row .step{
    flex:0 0 18px;width:18px;height:18px;padding:0;line-height:1;
    background:#12151c;border:1px solid var(--line);color:var(--dim);
    border-radius:4px;font:inherit;font-size:var(--fs);cursor:pointer;user-select:none;
  }
  .row .step:hover{color:var(--txt);border-color:var(--acc)}
  /* hex editável ao lado de cada seletor de cor */
  .row .hexin{
    flex:0 0 68px;width:68px;background:#12151c;color:var(--dim);border:1px solid var(--line);
    border-radius:5px;padding:3px 5px;font:inherit;font-size:var(--fs-sm);font-variant-numeric:tabular-nums;
    text-transform:uppercase;
  }
  .row .hexin:focus{color:var(--txt);border-color:var(--acc)}
  .row.seg{gap:4px}
  .seg button{
    flex:1;background:#12151c;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:5px 4px;font:inherit;font-size:var(--fs);cursor:pointer;
  }
  .seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
  /* Sobrou UM lugar para texto solto no painel: o aviso condicional, que é
     estado e não documentação. Toda explicação mora no `?` de cada seção. */
  .hint{color:var(--dim);font-size:var(--fs-sm);margin:6px 2px 0}
  .hint.warn{color:var(--warn)}
  .hint.warn:empty{display:none}

  /* ---------- ajuda em popover ----------
     Popover NATIVO, não `position:absolute`: o painel é `overflow-y:auto` e
     recortaria qualquer coisa posicionada dentro dele. De quebra, o nativo já
     traz top layer, fechar com Esc e fechar clicando fora. */
  .ajuda{
    width:16px;height:16px;padding:0;margin-left:3px;vertical-align:-3px;
    background:none;border:1px solid var(--line);color:var(--dim);border-radius:50%;
    font:inherit;font-size:var(--fs-sm);line-height:1;cursor:pointer;
  }
  .ajuda:hover,.ajuda[aria-expanded=true]{color:var(--txt);border-color:var(--acc2)}
  .pop{
    position:fixed;inset:auto;margin:0;
    width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow-y:auto;
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;box-shadow:0 14px 36px rgba(0,0,0,.55);
    font-size:var(--fs-sm);line-height:1.55;
  }
  .pop h3{margin:0 0 7px;font-size:var(--fs);font-weight:600}
  .pop p{margin:0 0 9px;color:var(--dim)}
  .pop p:last-child{margin-bottom:0}
  .pop em{font-style:normal;font-weight:600;color:var(--txt)}
  .pop code{background:#12151c;border:1px solid var(--line);border-radius:3px;padding:1px 4px}
  .pop::backdrop{background:transparent}
  .swatches{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
  /* pílulas das paletas preformatadas */
  .pal{
    display:flex;align-items:center;gap:5px;background:#12151c;border:1px solid var(--line);
    color:var(--dim);border-radius:99px;padding:3px 9px 3px 4px;cursor:pointer;font:inherit;font-size:var(--fs);
  }
  .pal:hover{color:var(--txt);border-color:var(--acc2)}
  .pal .pv{display:flex;gap:2px}
  .pal .pv i{width:8px;height:12px;border-radius:2px;display:block}

  /* ---------- camadas ---------- */
  .cam{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--panel2);overflow:hidden}
  .cam.off{opacity:.45}
  .chead{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 2px;cursor:pointer;user-select:none;background:#1b1f29}
  .sw{width:11px;height:11px;border-radius:3px;flex:0 0 11px;border:1px solid rgba(255,255,255,.25);display:inline-block}
  .chead .name{flex:1;font-size:var(--fs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chead .meta{color:var(--dim);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
  /* O chevron é um <button> de verdade: era um <span> dentro de uma <div>, e
     abrir uma camada não tinha como ser feito pelo teclado. */
  .chead .chev{
    flex:0 0 24px;width:24px;height:24px;padding:0;background:none;border:none;
    color:var(--dim);cursor:pointer;font-size:var(--fs-sm);line-height:1;
  }
  .chead .chev span{display:inline-block;transition:transform .15s}
  .cam.open .chev span{transform:rotate(90deg)}
  .chead .chev:hover{color:var(--txt)}
  .cbody{display:none;padding:4px 9px 9px;border-top:1px solid var(--line)}
  .cam.open .cbody{display:block}
  /* 24×24 e não 11×12. Os quatro ficavam encostados, e o × (que apaga, sem
     confirmar) colava no ⧉ (que duplica): errar de alvo custava a camada. */
  .icon{
    flex:0 0 24px;width:24px;height:24px;padding:0;background:none;border:none;
    color:var(--dim);cursor:pointer;font-size:var(--fs);line-height:1;border-radius:4px;
  }
  .icon:hover{background:#252a36}
  /* o destrutivo fica separado do resto e avisa a cor no hover */
  .icon.perigo{margin-left:6px}
  .icon.perigo:hover{color:var(--bad);background:#2a1a18}
  /* linha "reduzir para N [botão]": o número fica estreito para sobrar largura
     ao botão, que é quem carrega o texto de retorno ("3 cores fundidas") */
  .row input.alvo{flex:0 0 52px;text-align:right}
  .row .act{
    flex:1;min-width:0;background:#12151c;color:var(--txt);border:1px solid var(--line);
    border-radius:5px;padding:4px 6px;font:inherit;font-size:var(--fs);cursor:pointer;white-space:nowrap
  }
  .row .act:hover{border-color:var(--acc);color:#fff}
  .icon:hover{color:var(--txt)}
  .addcam{width:100%;background:#12151c;border:1px dashed var(--line);color:var(--dim);border-radius:8px;padding:8px;cursor:pointer;font:inherit}
  .addcam:hover{color:var(--txt);border-color:var(--acc)}

  /* ---------- área principal ---------- */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .bar .sp{flex:1}
  .tab{background:#12151c;border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:5px 12px;cursor:pointer;font:inherit;font-size:var(--fs)}
  .tab.on{background:var(--panel2);color:var(--txt);border-color:var(--acc)}
  .preset{background:#12151c;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:4px 11px;cursor:pointer;font:inherit;font-size:var(--fs)}
  .preset:hover{color:var(--txt);border-color:var(--acc2)}
  .stage{flex:1;position:relative;background:radial-gradient(circle at 50% 45%, #1b1f29 0%, #0d0f14 70%);min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}
  .foot{display:flex;align-items:center;gap:12px;padding:9px 14px;border-top:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .stat{color:var(--dim);font-size:var(--fs);font-variant-numeric:tabular-nums}
  .stat b{color:var(--txt);font-weight:600}
  .badge{padding:2px 8px;border-radius:99px;font-size:var(--fs-sm);border:1px solid}
  .badge.ok{color:var(--ok);border-color:#2f4f3c;background:#152119}
  .badge.warn{color:var(--warn);border-color:#4f402a;background:#211b12}
  .badge.bad{color:var(--bad);border-color:#5a2f2a;background:#211413}
  .btn{background:var(--acc);color:var(--on-acc);border:none;border-radius:6px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6;cursor:progress}
  .btn.ghost{background:#12151c;color:var(--dim);border:1px solid var(--line);font-weight:400}
  .btn.ghost:hover{color:var(--txt)}
  select.sel,input.sel{background:#12151c;color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit;font-size:var(--fs)}
  input.sel::placeholder{color:var(--dim)}
  #s-swatches{display:inline-flex;gap:4px;vertical-align:-1px}
  /* Confirma o que acabou de acontecer. Um passo desfeito pode não mexer em
     nada visível, e aí sem isto o ⌘Z parece não ter funcionado. */
  .toast{
    position:absolute;left:50%;bottom:18px;transform:translate(-50%,6px);
    background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:99px;padding:6px 14px;font-size:var(--fs-sm);
    box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none;
    opacity:0;transition:opacity .16s cubic-bezier(.16,1,.3,1),transform .16s cubic-bezier(.16,1,.3,1);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){
    .toast{transition:opacity .01s}
    .toast.on{transform:translate(-50%,0)}
    .chead .chev span{transition:none}
  }
  .hud{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:var(--fs-sm);background:rgba(12,14,19,.65);padding:4px 9px;border-radius:5px;pointer-events:none}
  @media (max-width:860px){
    .app{flex-direction:column}
    .panel{width:100%;flex:0 0 46vh}
    main{flex:1}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>
      <span class="titulo">Mandala Forge<small data-i18n="app.sub"></small></span>
      <span class="idiomas">
        <button type="button" data-lang="pt" data-i18n-title="idioma.pt" data-i18n-aria="idioma.pt" aria-pressed="true">
          <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" fill="#009b3a"/><path d="M14 2.6 25.6 10 14 17.4 2.4 10Z" fill="#fedf00"/><circle cx="14" cy="10" r="4.4" fill="#002776"/><path d="M9.9 8.3a10 10 0 0 1 8.2 2.5" stroke="#fff" stroke-width="1.15" fill="none"/></svg>
        </button>
        <button type="button" data-lang="en" data-i18n-title="idioma.en" data-i18n-aria="idioma.en" aria-pressed="false">
          <svg viewBox="0 0 28 20" aria-hidden="true"><rect width="28" height="20" fill="#f4f4f6"/><g fill="#b22234"><rect y="0" width="28" height="1.54"/><rect y="3.08" width="28" height="1.54"/><rect y="6.15" width="28" height="1.54"/><rect y="9.23" width="28" height="1.54"/><rect y="12.31" width="28" height="1.54"/><rect y="15.38" width="28" height="1.54"/><rect y="18.46" width="28" height="1.54"/></g><rect width="12.4" height="10.77" fill="#3c3b6e"/><g fill="#fff"><circle cx="2.6" cy="2.2" r=".72"/><circle cx="6.2" cy="2.2" r=".72"/><circle cx="9.8" cy="2.2" r=".72"/><circle cx="4.4" cy="4.3" r=".72"/><circle cx="8" cy="4.3" r=".72"/><circle cx="2.6" cy="6.4" r=".72"/><circle cx="6.2" cy="6.4" r=".72"/><circle cx="9.8" cy="6.4" r=".72"/><circle cx="4.4" cy="8.5" r=".72"/><circle cx="8" cy="8.5" r=".72"/></g></svg>
        </button>
      </span>
    </h1>
    <div class="scroll" id="scroll">

      <fieldset>
        <legend><span data-i18n="fs.projeto">Projeto</span><button type="button" class="ajuda" popovertarget="aj-projeto" data-i18n-aria="aj.projeto">?</button></legend>
        <div class="row"><label data-i18n="lb.nome">Nome</label><input type="text" data-g="nome" maxlength="60" data-i18n-ph="ph.nome" placeholder="mandala"></div>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="fs.placa">Placa</span><button type="button" class="ajuda" popovertarget="aj-placa" data-i18n-aria="aj.placa">?</button></legend>
        <div class="row"><label data-i18n="lb.diam">Diâmetro</label><input type="range" data-g="diam" min="50" max="300" step="1"><span class="num" data-v="diam"></span></div>
        <div class="row"><label data-i18n="lb.base">Base</label><input type="range" data-g="base" min="0.4" max="10" step="0.2"><span class="num" data-v="base"></span></div>
        <div class="row"><label data-i18n="lb.baseSolida">Base sólida</label><input type="checkbox" data-g="baseSolida"><span class="num"></span></div>
        <div class="row"><label data-i18n="lb.sym">Simetria</label><input type="range" data-g="sym" min="3" max="36" step="1"><span class="num" data-v="sym"></span></div>
        <div class="row"><label data-i18n="lb.rot">Rotação</label><input type="range" data-g="rot" min="0" max="360" step="1"><span class="num" data-v="rot"></span></div>
        <div class="row"><label data-i18n="lb.aro">Aro</label><input type="range" data-g="aro" min="0" max="20" step="0.5"><span class="num" data-v="aro"></span></div>
        <div class="row"><label data-i18n="lb.aroH">Altura do aro</label><input type="range" data-g="aroH" min="0" max="6" step="0.1"><span class="num" data-v="aroH"></span></div>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="fs.filete">Filete</span><button type="button" class="ajuda" popovertarget="aj-filete" data-i18n-aria="aj.filete">?</button></legend>
        <div class="row"><label data-i18n="lb.fio">Largura</label><input type="range" data-g="fio" min="0.3" max="3" step="0.05"><span class="num" data-v="fio"></span></div>
        <div class="row"><label data-i18n="lb.fioH">Altura</label><input type="range" data-g="fioH" min="0.2" max="4" step="0.05"><span class="num" data-v="fioH"></span></div>
        <div class="row"><label data-i18n="lb.degrau">Degrau</label><input type="range" data-g="degrau" min="0" max="3" step="0.05"><span class="num" data-v="degrau"></span></div>
        <div class="row"><label data-i18n="lb.nivelUnico">Mesma altura</label><input type="checkbox" data-g="nivelUnico"><span class="num"></span></div>
        <div class="row"><label data-i18n="lb.suave">Suavizar</label><input type="checkbox" data-g="suave"><span class="num"></span></div>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="fs.furos">Centro e furos</span><button type="button" class="ajuda" popovertarget="aj-furos" data-i18n-aria="aj.furos">?</button></legend>
        <div class="row"><label data-i18n="lb.cone">Cone</label><input type="range" data-g="cone" min="0" max="70" step="0.5"><span class="num" data-v="cone"></span></div>
        <div class="row" data-only="cone"><label data-i18n="lb.coneH">Altura</label><input type="range" data-g="coneH" min="0" max="20" step="0.2"><span class="num" data-v="coneH"></span></div>
        <div class="row" data-only="cone"><label data-i18n="lb.coneC">Curvatura</label><input type="range" data-g="coneC" min="0.3" max="3" step="0.05"><span class="num" data-v="coneC"></span></div>
        <div class="row"><label data-i18n="lb.furo">Furo</label><input type="range" data-g="furo" min="0" max="30" step="0.5"><span class="num" data-v="furo"></span></div>
        <div class="row" data-only="furo"><label data-i18n="lb.furoP">Profundidade</label><input type="range" data-g="furoP" min="1" max="30" step="0.5"><span class="num" data-v="furoP"></span></div>
        <div class="row"><label data-i18n="lb.pend">Pendurar</label><input type="range" data-g="pend" min="0" max="12" step="0.5"><span class="num" data-v="pend"></span></div>
        <div class="row" data-only="pend"><label data-i18n="lb.pendA">Ângulo</label><input type="range" data-g="pendA" min="0" max="360" step="5"><span class="num" data-v="pendA"></span></div>
        <div class="row" data-only="pend"><label data-i18n="lb.pendR">Posição no aro</label><input type="range" data-g="pendR" min="0.1" max="3" step="0.05"><span class="num" data-v="pendR"></span></div>
        <p class="hint warn" id="avisoPend" data-only="pend"></p>
      </fieldset>

      <fieldset>
        <legend><span data-i18n="fs.corpo">Corpo</span><button type="button" class="ajuda" popovertarget="aj-corpo" data-i18n-aria="aj.corpo">?</button></legend>
        <div class="row seg">
          <button data-modo="placa" data-i18n="bt.placa"></button>
          <button data-modo="vazado" data-i18n="bt.vazado"></button>
        </div>

<script id="mandala-core">
/* =========================================================================
   NÚCLEO — mandala em cloisonné: cada motivo é uma região com distância
   assinada; a borda dessa região (e as linhas internas) viram FILETE, que
   sobe acima do patamar da camada. O miolo fica rebaixado — a poça de
   esmalte. Sem qualquer dependência de DOM (é testável fora do navegador).
   ========================================================================= */
var MC = (function () {
  'use strict';
  var TAU = Math.PI * 2, PI = Math.PI;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* Motivos: o contorno externo de uma peça do desenho. */
  var MOTIVOS = [
    ['folha', 'Folha'], ['gota', 'Gota'], ['arco', 'Arco'], ['ponto', 'Ponto'],
    ['cunha', 'Cunha'], ['losango', 'Losango'], ['anel', 'Anel']
  ];
  /* Preenchimentos: o que acontece DENTRO do motivo. */
  var PREENCH = [
    ['nenhum', 'Liso'], ['contornos', 'Contornos'], ['nervuras', 'Nervuras'],
    ['gotaint', 'Gota interna'], ['pontoint', 'Ponto interno']
  ];

  function camada(o) {
    var c = {
      on: true,
      motivo: 'folha',
      mult: 1,                 // n = round(sym * mult)
      r0: 0.35, r1: 0.85,      // faixa radial, fração do raio
      larg: 0.9,               // largura relativa ao setor disponível
      base: 0.8,               // expoente da extremidade interna (baixo = redonda)
      ponta: 1.0,              // expoente da extremidade externa (alto = afilada)
      fase: 0,                 // graus — legado, só vale se fasePasso for nulo
      fasePasso: null,         // fração do passo (1 passo = 360/n): 0,5 = meio passo
      nivel: 1,                // patamar (altura = nivel * degrau)
      borda: true,             // desenha o filete de contorno externo?
      preench: 'nenhum',
      passo: 2.2,              // mm — espaçamento dos contornos internos
      linhas: 5,               // nº de nervuras
      incl: 0.7,               // inclinação das nervuras (0 = galões retos)
      espinha: true,           // nervura central
      cor: '#e8862a',
      cor2: '#f4e9d8'
    };
    for (var k in (o || {})) c[k] = o[k];
    return c;
  }

  function defaults() {
    return {
      nome: 'mandala',
      diam: 120, base: 3, sym: 10, rot: 0,
      aro: 4, aroH: 1.2,
      fio: 0.9, fioH: 1.0, degrau: 0.7,
      cone: 22, coneH: 6, coneC: 0.75, furo: 3, furoP: 9,
      pend: 0, pendA: 90, pendR: 0.5,
      modo: 'placa', conn: 0, connW: 1.6, suave: true, nivelUnico: true, baseSolida: false, maquina: 'h2c',
      corBase: '#5b2a7a', corFio: '#f6f2e8', luz: 315, verniz: 0.45,
      camadas: [
        camada({ motivo: 'anel', mult: 1, r0: 0.16, r1: 0.82, nivel: 0, preench: 'nenhum', cor: '#2b1330' }),
        camada({ motivo: 'folha', mult: 1, r0: 0.40, r1: 0.92, larg: 1.0, base: 0.8, ponta: 1.0, nivel: 1, preench: 'nervuras', linhas: 5, incl: 0.75, cor: '#ee8a2b' }),
        camada({ motivo: 'arco', mult: 1, r0: 0.44, r1: 0.60, larg: 0.5, nivel: 2, preench: 'contornos', passo: 2.0, cor: '#b06fd0', cor2: '#f6f2e8' }),
        camada({ motivo: 'ponto', mult: 1, fase: 18, r0: 0.60, r1: 0.72, larg: 0.34, nivel: 1, cor: '#f2d02c' }),
        camada({ motivo: 'arco', mult: 1, r0: 0.24, r1: 0.40, larg: 0.52, nivel: 2, preench: 'contornos', passo: 1.8, cor: '#ee8a2b', cor2: '#f6f2e8' }),
        camada({ motivo: 'gota', mult: 2, r0: 0.10, r1: 0.22, larg: 0.8, base: 0.45, ponta: 1.2, nivel: 3, cor: '#b06fd0' })
      ]
    };
  }

  /* ---- deslocamento angular até o eixo de repetição mais próximo ---- */
  function angOff(a, n) {
    var p = TAU / n;
    return a - Math.floor(a / p + 0.5) * p;                            // ∈ [-p/2, p/2]
  }
  /* distância no plano entre (r,0) e (rc,da) em coordenadas polares */
  function polarDist(r, rc, da) {
    return Math.sqrt(Math.max(0, r * r + rc * rc - 2 * r * rc * Math.cos(da)));
  }

  /* -------------------------------------------------------------------------
     Perfil de meia-largura ao longo do eixo do motivo, w(t) ∈ 0..1.

     `base` e `ponta` são os expoentes de cada extremidade:
       expoente < 0,6  → extremidade arredondada (derivada infinita)
       expoente ≈ 1    → extremidade em bico de ~60°
       expoente > 1,5  → extremidade bem afilada
     A barriga cai sozinha em t = base/(base+ponta), então gota (base 0,45 /
     ponta 1,2) fica gorda embaixo e fina na ponta, e folha (0,8 / 0,9) sai
     ogival. Normalizado para que o máximo seja sempre 1.
     ------------------------------------------------------------------------- */
  function perfil(motivo, t, base, ponta) {
    if (t <= 0 || t >= 1) return 0;
    if (motivo === 'losango') return 1 - Math.abs(2 * t - 1);
    if (motivo === 'cunha') {                                          // lados retos, ponta reta
      var tm = clamp(1 - base * 0.5, 0.05, 0.9);
      return t < tm ? (0.45 + 0.55 * t / tm) : (1 - t) / (1 - tm);
    }
    var ts = base / (base + ponta);                                    // posição da barriga
    var m = Math.pow(ts, base) * Math.pow(1 - ts, ponta);
    return Math.pow(t, base) * Math.pow(1 - t, ponta) / m;
  }

  /* ---- pré-processamento: uma entrada por camada ativa ---- */
  function prepare(cfg, res) {
    var out = [], i;
    var R = Math.max(1, cfg.diam / 2);
    for (i = 0; i < cfg.camadas.length; i++) {
      var c = cfg.camadas[i];
      if (!c.on) continue;
      var r0 = Math.min(c.r0, c.r1), r1 = Math.max(c.r0, c.r1);
      if (r1 - r0 < 1e-3) continue;
      var n = Math.max(1, Math.round(cfg.sym * c.mult));
      // A fase mora em PASSOS da simetria, não em graus: 1 passo = 360/n, então
      // meio passo continua sendo meio passo quando a simetria muda. `fase` em
      // graus fica como fallback para configs antigas.
      var faseDeg = (c.fasePasso === null || c.fasePasso === undefined || !isFinite(c.fasePasso))
        ? c.fase : c.fasePasso * 360 / n;
      var mid = (r0 + r1) / 2, half = (r1 - r0) / 2;
      var setor = PI * mid / n;                                        // meia-largura do setor em mid
      var g = {
        idx: i, motivo: c.motivo, n: n,
        ph: (faseDeg + cfg.rot) * PI / 180,
        r0: r0, r1: r1, mid: mid, half: half, len: r1 - r0,
        hw: Math.max(0.004, c.larg * setor),
        base: clamp(c.base, 0.15, 4), ponta: clamp(c.ponta, 0.15, 4),
        // com nivelUnico, toda camada divide o mesmo patamar: a mandala fica
        // plana e só cone e aro têm altura própria. É o desenho de esmalte
        // clássico — e, de quebra, junta regiões na exportação por contorno.
        nivel: cfg.nivelUnico ? 1 : c.nivel,
        borda: c.borda !== false,
        preench: c.preench,
        passo: Math.max(0.3, c.passo) / R,                             // mm → fração de raio
        linhas: Math.max(1, Math.round(c.linhas)),
        incl: c.incl, espinha: !!c.espinha,
        cor: c.cor, cor2: c.cor2
      };
      if (g.motivo === 'ponto') g.rad = Math.min(half, g.hw);
      // no arco a calota arredondada soma a espessura: desconta, para que
      // larg = 1 signifique "encosta no vizinho" e não "invade o vizinho"
      if (g.motivo === 'arco') g.spanA = Math.max(0, c.larg * PI / n - half / mid);
      var pad = 0.004;
      g.lo = r0 - pad; g.hi = r1 + pad;
      out.push(g);
    }
    /* Largura da faixa de transição do filete, em fração de raio.

       Tem que acompanhar a CÉLULA da grade, não ser fixa: antisserrilhado só
       funciona se a transição cobrir pelo menos uma célula. Com `res`, usa a
       maior das duas dimensões da célula naquele raio (a radial é constante, a
       angular cresce com r). Sem `res` — o preview pixel a pixel, que é bem
       mais fino que a grade — cai num valor pequeno e fixo. */
    var P = { cam: out, fioN: Math.max(1e-4, cfg.fio / R) };
    if (cfg.suave === false) P.sw = 0;
    else if (res) { P.celR = 0.7 / res.nr; P.celT = 0.7 * TAU / res.nt; P.sw = -1; }
    else P.sw = 0.15 / R;
    return P;
  }

  /* =======================================================================
     Distância assinada de um ponto ao motivo (positiva dentro), em fração
     do raio da placa. `o` recebe as coordenadas locais para o preenchimento.
     ======================================================================= */
  function dist(g, r, th, o) {
    var a = angOff(th + g.ph, g.n), lat = a * r, d, over, w, t;
    switch (g.motivo) {
      case 'anel':
        o.t = (r - g.r0) / g.len; o.lat = lat; o.hw = g.hw;
        return Math.min(r - g.r0, g.r1 - r);
      case 'arco':
        over = Math.max(0, Math.abs(a) - g.spanA) * r;
        d = g.half - Math.sqrt((r - g.mid) * (r - g.mid) + over * over);
        o.t = (r - g.r0) / g.len; o.lat = lat; o.hw = g.hw;
        return d;
      case 'ponto':
        d = g.rad - polarDist(r, g.mid, a);
        o.t = (r - g.r0) / g.len; o.lat = lat; o.hw = g.rad;
        return d;
      default:                                                         // folha, gota, cunha, losango
        t = (r - g.r0) / g.len;
        w = perfil(g.motivo, t, g.base, g.ponta);
        o.t = t; o.lat = lat; o.hw = g.hw * w;
        if (w <= 0) return -1;
        d = g.hw * w - Math.abs(lat);
        if (d > r - g.r0) d = r - g.r0;
        if (d > g.r1 - r) d = g.r1 - r;
        return d;
    }
  }

  /* -------------------------------------------------------------------------
     O ponto cai num filete? Devolve 0..1, não 0/1: a borda tem uma faixa de
     transição de `sw` (0,18 mm) onde o valor sobe suavemente.

     Isso é o que tira o serrilhado da malha. Com resposta binária, a fronteira
     do filete cai exatamente numa linha da grade e o degrau vertical vira uma
     escada de meia largura de filete — o efeito de pente que aparece no
     fatiador. Com a transição, o campo de altura é contínuo e a grade o
     amostra como rampa, em qualquer resolução.

     `o.banda` sai junto, para alternar cor nos contornos aninhados.
     ------------------------------------------------------------------------- */
  function filete(g, d, o, fioN, sw) {
    o.banda = 0;
    var v = 0, t;
    function macio(x) {                                                // x > 0 = dentro
      if (sw <= 0) return x > 0 ? 1 : 0;
      t = x / sw + 0.5;
      return t <= 0 ? 0 : (t >= 1 ? 1 : t);
    }
    if (g.borda) v = macio(fioN - d);                                  // contorno externo
    var k, resto, dl;
    switch (g.preench) {
      case 'contornos':
        k = Math.floor(d / g.passo);
        o.banda = k;
        resto = d - k * g.passo;
        t = macio(fioN - resto); if (t > v) v = t;
        t = macio(fioN - (g.passo - resto)); if (t > v) v = t;
        break;
      case 'nervuras':
        if (g.espinha) { t = macio(fioN - Math.abs(o.lat)); if (t > v) v = t; }
        var f = (o.t - g.incl * Math.abs(o.lat) / g.len) * g.linhas;   // cisalha em galão
        dl = Math.abs(f - Math.round(f)) * g.len / g.linhas;
        if (f > 0 && f < g.linhas) { t = macio(fioN - dl); if (t > v) v = t; }
        break;
      case 'gotaint':                                                  // gota maciça acompanhando o eixo
        var w2 = perfil('gota', o.t, 0.5, 1.2);
        t = macio(0.45 * o.hw * w2 - Math.abs(o.lat)); if (t > v) v = t;
        break;
      case 'pontoint':                                                 // bolinha maciça no meio
        var rc = g.r0 + 0.5 * g.len;
        var rad = 0.34 * Math.min(g.hw, g.half);
        t = macio(rad - polarDist(g.r0 + o.t * g.len, rc, o.lat / (rc + 1e-6))); if (t > v) v = t;
        break;
    }
    return v;
  }

  /* =======================================================================
     Amostra: qual camada reivindica este ponto, em que patamar, filete ou
     poça. `out` é reaproveitado entre chamadas (evita lixo no preview).
     id = -1 fundo da placa · -2 cone · -3 aro
     ======================================================================= */
  function amostra(P, r, th, out) {
    out.id = -1; out.nivel = 0; out.fio = 0; out.banda = 0; out.cor = null; out.cor2 = null;
    var C = P.cam, i, g, d;
    var sw = P.sw;
    if (sw < 0) { sw = P.celT * r; if (P.celR > sw) sw = P.celR; }     // célula local
    var o = out._o || (out._o = { t: 0, lat: 0, hw: 0, banda: 0 });
    for (i = 0; i < C.length; i++) {
      g = C[i];
      if (r < g.lo || r > g.hi) continue;
      d = dist(g, r, th, o);
      if (d <= 0) continue;
      out.id = g.idx; out.nivel = g.nivel;
      out.fio = filete(g, d, o, P.fioN, sw);
      out.banda = o.banda;
      out.cor = g.cor; out.cor2 = g.cor2;
    }
    return out;
  }

  /* ---- altura em mm no ponto (rmm em MILÍMETROS) ---- */
  function altura(cfg, P, rmm, th, out) {
    var R = cfg.diam / 2, base = cfg.base;
    out = out || {};
    if (cfg.cone > 0 && rmm < cfg.cone / 2) {
      out.id = -2; out.fio = 0; out.nivel = 0;
      if (cfg.furo > 0 && rmm < cfg.furo / 2)
        return Math.max(0.8, base + cfg.coneH - cfg.furoP);
      var u = rmm / (cfg.cone / 2);
      return base + cfg.coneH * Math.pow(1 - u, Math.max(0.1, cfg.coneC));
    }
    if (cfg.aro > 0 && rmm > R - cfg.aro) {
      out.id = -3; out.fio = 0; out.nivel = 0;
      return base + cfg.aroH;
    }
    amostra(P, rmm / R, th, out);
    if (out.id < 0) return base;
    return base + out.nivel * cfg.degrau + out.fio * cfg.fioH;
  }

  /* ---- altura de um nó da grade (a suavização mora em filete(), não aqui) ---- */
  function alturaNo(cfg, P, rmm, th, dr, dt, out) {
    return altura(cfg, P, rmm, th, out);
  }

  /* ---- há material aqui? (rmm em MILÍMETROS) ---- */
  function solid(cfg, P, rmm, th, out) {
    var R = cfg.diam / 2;
    if (rmm > R) return false;
    /* Furo de pendurar: um cilindro passante, e o ÚNICO ponto onde ele existe.
       Tem que vir antes do curto-circuito do modo placa, que devolve `true`
       para tudo e engoliria o furo. Daqui, o resto vem de graça: `cobertura()`
       já filtra por `solid`, então o marching squares fecha em volta dele com
       borda lisa; a grade polar vira célula ausente com parede; os previews
       seguem `solid` sozinhos. `altura()` não precisa saber de nada — lá dentro
       ela nunca é amostrada. */
    if (cfg.pend > 0) {
      /* O ângulo é NEGADO de propósito: a vista de topo desenha com o y da
         tela crescendo para baixo, então o ângulo do modelo aparece espelhado
         na vertical. Como o usuário mira o furo olhando o preview, `pendA` é
         medido na tela — 90° é o topo do que ele vê. Para a peça impressa isso
         é indiferente: o desenho é n-fold e a posição do furo na mesa não muda
         nada. */
      var ap = -cfg.pendA * PI / 180;
      var rp = R - cfg.aro * (cfg.pendR == null ? 0.5 : cfg.pendR);
      var dx = rmm * Math.cos(th) - rp * Math.cos(ap);
      var dy = rmm * Math.sin(th) - rp * Math.sin(ap);
      if (dx * dx + dy * dy < cfg.pend * cfg.pend / 4) return false;
    }
    if (cfg.modo === 'placa') return true;
    if (cfg.cone > 0 && rmm < cfg.cone / 2 + 0.6) return true;
    if (cfg.aro > 0 && rmm >= R - cfg.aro) return true;
    if (cfg.conn > 0 && cfg.connW > 0) {
      var n = Math.max(1, Math.round(cfg.conn));
      if (Math.abs(angOff(th + cfg.rot * PI / 180, n)) * rmm < cfg.connW / 2) return true;
    }
    amostra(P, rmm / R, th, out || {});
    return (out || {}).id >= 0;
  }

  /* ---- altura máxima possível (para normalizar o preview) ---- */
  function alturaMax(cfg) {
    var base = cfg.base, m = base + cfg.aroH, i;
    for (i = 0; i < cfg.camadas.length; i++) {
      if (!cfg.camadas[i].on) continue;
      var niv = cfg.nivelUnico ? 1 : cfg.camadas[i].nivel;
      var z = base + niv * cfg.degrau + cfg.fioH;
      if (z > m) m = z;
    }
    if (cfg.cone > 0) m = Math.max(m, base + cfg.coneH);
    return m;
  }

  /* -------------------------------------------------------------------------
     Resolução por qualidade. `nt` (angular) é sempre múltiplo de 4× a simetria.

     É `nt` que decide se o filete sobrevive: a célula no aro mede pi*D/nt, e o
     filete tem tipicamente 0,8 mm. Abaixo de ~3 células por filete a borda sai
     em escada. Daí o nível `fino`, que troca resolução radial (barata de
     sobra) por angular, ficando com contagem de triângulos parecida com a de
     `max` mas com célula menos da metade no aro:

       qualidade   grade        célula no aro (D=120)   células por filete 0,8 mm
       teste       140 x  720   0,52 mm                 1,5
       bom         240 x 1080   0,35 mm                 2,3
       alta        340 x 1440   0,26 mm                 3,1
       max         440 x 1800   0,21 mm                 3,8
       fino        220 x 2880   0,13 mm                 6,1
     ------------------------------------------------------------------------- */
  var QUAL = { teste: [140, 720], bom: [240, 1080], alta: [340, 1440], max: [440, 1800], fino: [220, 2880] };
  // Grade da via por CONTORNO. É cartesiana e não tem nada a ver com a polar
  // acima: aqui a célula não decide o degrau da borda (a curva de nível decide),
  // só de quantos segmentos ela é feita. Por isso rende muito mais por célula.
  var QUAL_CONT = { teste: 200, bom: 320, alta: 420, max: 560, fino: 700 };
  function resolucaoContorno(q) { return QUAL_CONT[q] || QUAL_CONT.bom; }
  function resolution(cfg, q) {
    var p = QUAL[q] || QUAL.bom;
    var sym = Math.max(3, Math.round(cfg.sym)), m = sym * 4;
    var nt = Math.max(m * 3, Math.round(p[1] / m) * m);
    return { nr: p[0], nt: Math.min(nt, 3600) };
  }

  /* ---- buffer de triângulos ---- */
  function Buf() { this.a = new Float32Array(1 << 17); this.n = 0; }
  Buf.prototype.tri = function (x1, y1, z1, x2, y2, z2, x3, y3, z3) {
    if (this.n + 9 > this.a.length) {
      var b = new Float32Array(this.a.length * 2); b.set(this.a); this.a = b;
    }
    var a = this.a, n = this.n;
    a[n] = x1; a[n + 1] = y1; a[n + 2] = z1;
    a[n + 3] = x2; a[n + 4] = y2; a[n + 5] = z2;
    a[n + 6] = x3; a[n + 7] = y3; a[n + 8] = z3;
    this.n = n + 9;
  };

  /* =======================================================================
     Malha: grade polar NR x NT. Alturas nos nós, presença no centro da
     célula. Topo + fundo em z=0 + paredes em toda fronteira. As
     quatro invariantes de estanqueidade do mesher polar valem aqui:
       1. os nós de i=0 colapsam num ponto (altura mediada, 1 triângulo);
       2. as paredes usam as alturas dos nós compartilhados;
       3. o fundo só vira leque único quando TODAS as células existem;
       4. cada aresta aparece exatamente duas vezes, com sentidos opostos.
     ======================================================================= */
  /* =======================================================================
     Geometria INDEXADA. É a única implementação da malha: buildMesh() só
     expande isto em sopa de triângulos para a auditoria. Índices existem
     porque o OBJ precisa deles — e, de quebra, o vértice do centro é um só.

     Numeração dos vértices (NT por anel, mais o ponto único do centro):
       topo  : i=0 → 0        · i>0 → 1 + (i-1)*NT + j
       fundo : os mesmos, deslocados de nTopo
     ======================================================================= */
  function grade(cfg, res, comCor) {
    var R = cfg.diam / 2;
    var NR = res.nr, NT = res.nt;
    var P = prepare(cfg, res);
    var i, j;
    var tmp = {};

    var rs = new Float64Array(NR + 1);
    for (i = 0; i <= NR; i++) rs[i] = R * i / NR;
    var cs = new Float64Array(NT), sn = new Float64Array(NT), ths = new Float64Array(NT);
    for (j = 0; j < NT; j++) { ths[j] = TAU * j / NT; cs[j] = Math.cos(ths[j]); sn[j] = Math.sin(ths[j]); }

    /* alturas nos nós (ver alturaNo: é ela que tira o serrilhado) */
    var z = new Float32Array((NR + 1) * NT);
    var dr = (R / NR) * 0.34, dt = (TAU / NT) * 0.34;
    for (i = 0; i <= NR; i++)
      for (j = 0; j < NT; j++) z[i * NT + j] = alturaNo(cfg, P, rs[i], ths[j], dr, dt, tmp);
    var acc = 0;                                                       // nó central único
    for (j = 0; j < NT; j++) acc += z[j];
    acc /= NT; for (j = 0; j < NT; j++) z[j] = acc;

    /* presença e cor por célula (avaliadas no centro) */
    var pres = new Uint8Array(NR * NT);
    var mat = comCor ? new Uint16Array(NR * NT) : null;
    var paleta = [], mapa = null;
    if (comCor) { mapa = {}; paleta.push(cfg.corBase); mapa[cfg.corBase] = 0; }
    var dth = TAU / NT;
    for (i = 0; i < NR; i++) {
      var rc = (rs[i] + rs[i + 1]) / 2;
      for (j = 0; j < NT; j++) {
        var thc = ths[j] + dth / 2;
        if (!solid(cfg, P, rc, thc, tmp)) continue;
        pres[i * NT + j] = 1;
        if (!comCor) continue;
        altura(cfg, P, rc, thc, tmp);                                  // preenche tmp com a amostra
        var hx = tmp.id < 0 ? cfg.corBase
          : (tmp.fio >= 0.5 ? cfg.corFio : (tmp.banda % 2 === 1 && tmp.cor2 ? tmp.cor2 : tmp.cor));
        if (!(hx in mapa)) { mapa[hx] = paleta.length; paleta.push(hx); }
        mat[i * NT + j] = mapa[hx];
      }
    }

    /* ---- vértices ---- */
    var nTopo = 1 + NR * NT, nv = 2 * nTopo;
    var vx = new Float32Array(nv * 3);
    vx[0] = 0; vx[1] = 0; vx[2] = acc;                                 // centro do topo
    vx[nTopo * 3] = 0; vx[nTopo * 3 + 1] = 0; vx[nTopo * 3 + 2] = 0;   // centro do fundo
    for (i = 1; i <= NR; i++) for (j = 0; j < NT; j++) {
      var t = (1 + (i - 1) * NT + j) * 3;
      vx[t] = rs[i] * cs[j]; vx[t + 1] = rs[i] * sn[j]; vx[t + 2] = z[i * NT + j];
      var b = (nTopo + 1 + (i - 1) * NT + j) * 3;
      vx[b] = vx[t]; vx[b + 1] = vx[t + 1]; vx[b + 2] = 0;
    }
    var maxZ = 0;
    for (i = 0; i < z.length; i++) if (z[i] > maxZ) maxZ = z[i];
    return {
      NR: NR, NT: NT, nTopo: nTopo, nv: nv, vx: vx,
      pres: pres, mat: mat, paleta: paleta,
      height: maxZ, diam: cfg.diam,
      T: function (i, j) { return i === 0 ? 0 : 1 + (i - 1) * NT + j; },
      B: function (i, j) { return nTopo + (i === 0 ? 0 : 1 + (i - 1) * NT + j); }
    };
  }

  /* ---- buffer de índices; `cap` é em TRIÂNGULOS, não em elementos ---- */
  function BufI() { this.cap = 1 << 14; this.i = new Uint32Array(this.cap * 3); this.m = new Uint16Array(this.cap); this.n = 0; }
  BufI.prototype.tri = function (a, b, c, mm) {
    if (this.n === this.cap) {
      this.cap *= 2;
      var ni = new Uint32Array(this.cap * 3); ni.set(this.i); this.i = ni;
      var nm = new Uint16Array(this.cap); nm.set(this.m); this.m = nm;
    }
    this.i[this.n * 3] = a; this.i[this.n * 3 + 1] = b; this.i[this.n * 3 + 2] = c;
    this.m[this.n] = mm; this.n++;
  };

  /* -------------------------------------------------------------------------
     Emite um grupo de células como sólido fechado. `pertence` decide o que
     entra; as paredes sobem em toda fronteira com quem está fora. Serve tanto
     para a peça inteira (pertence = presença) quanto para uma peça por cor.
     ------------------------------------------------------------------------- */
  function emitir(G, pertence, corDe, leque) {
    var NR = G.NR, NT = G.NT, T = G.T, B = G.B, i, j;
    var out = new BufI();
    var todas = true;
    for (i = 0; i < pertence.length; i++) if (!pertence[i]) { todas = false; break; }
    todas = todas && !!leque;

    for (i = 0; i < NR; i++) {
      for (j = 0; j < NT; j++) {
        if (!pertence[i * NT + j]) continue;
        var jp = (j + 1) % NT, jm = (j - 1 + NT) % NT;
        var m = corDe ? corDe(i, j) : 0;
        var a = T(i, j), b = T(i, jp), c = T(i + 1, jp), d = T(i + 1, j);
        var a0 = B(i, j), b0 = B(i, jp), c0 = B(i + 1, jp), d0 = B(i + 1, j);
        var noCentro = (i === 0);

        out.tri(a, d, c, m);                                           // topo
        if (!noCentro) out.tri(a, c, b, m);
        if (!todas) {                                                  // fundo
          out.tri(a0, c0, d0, m);
          if (!noCentro) out.tri(a0, b0, c0, m);
        }
        if (!noCentro && !pertence[(i - 1) * NT + j]) {                // parede interna
          out.tri(a0, b, b0, m); out.tri(a0, a, b, m);
        }
        if (i === NR - 1 || !pertence[(i + 1) * NT + j]) {             // parede externa
          out.tri(d0, c0, c, m); out.tri(d0, c, d, m);
        }
        if (!pertence[i * NT + jm]) { out.tri(a0, d0, d, m); out.tri(a0, d, a, m); }
        if (!pertence[i * NT + jp]) { out.tri(b0, c, c0, m); out.tri(b0, b, c, m); }
      }
    }
    if (todas) {                                                       // fundo em leque
      for (j = 0; j < NT; j++) out.tri(B(0, j), B(NR, (j + 1) % NT), B(NR, j), 0);
    }
    return { idx: out.i, mat: out.m, tris: out.n };
  }

  /* ---- peça inteira, um sólido só ---- */
  function buildIndexed(cfg, res, comCor) {
    var G = grade(cfg, res, comCor);
    var e = emitir(G, G.pres, comCor ? function (i, j) { return G.mat[i * G.NT + j]; } : null, true);
    return {
      vx: G.vx, nv: G.nv, idx: e.idx, tris: e.tris,
      mat: comCor ? e.mat : null, paleta: G.paleta,
      height: G.height, diam: G.diam, parts: components(G.pres, G.NR, G.NT)
    };
  }

  /* ---- sopa de triângulos (o que a auditoria espera) ---- */
  function buildMesh(cfg, res) {
    var g = buildIndexed(cfg, res, false);
    var pos = new Float32Array(g.tris * 9), i, k;
    for (i = 0; i < g.tris; i++) {
      for (k = 0; k < 3; k++) {
        var v = g.idx[i * 3 + k] * 3, o = i * 9 + k * 3;
        pos[o] = g.vx[v]; pos[o + 1] = g.vx[v + 1]; pos[o + 2] = g.vx[v + 2];
      }
    }
    return {
      pos: pos, n: g.tris * 9, tris: g.tris,
      height: g.height, diam: g.diam, parts: g.parts
    };
  }

  /* ---- quantas peças separadas? (aviso de impressão) ---- */
  function components(pres, NR, NT) {
    var seen = new Uint8Array(NR * NT), stack = [], count = 0, i, j;
    for (i = 0; i < NR; i++) for (j = 0; j < NT; j++) {
      var s = i * NT + j;
      if (!pres[s] || seen[s]) continue;
      count++; seen[s] = 1; stack.push(s);
      while (stack.length) {
        var c = stack.pop(), ci = (c / NT) | 0, cj = c % NT, nb, t;
        nb = [ci * NT + (cj + 1) % NT, ci * NT + (cj - 1 + NT) % NT];
        if (ci > 0) nb.push((ci - 1) * NT + cj);
        if (ci < NR - 1) nb.push((ci + 1) * NT + cj);
        if (ci === 0) for (t = 0; t < NT; t++) nb.push(t);             // tudo se toca no centro
        for (t = 0; t < nb.length; t++) if (pres[nb[t]] && !seen[nb[t]]) { seen[nb[t]] = 1; stack.push(nb[t]); }
      }
    }
    return count;
  }

  /* =======================================================================
     3MF — ZIP + XML, escrito à mão para não trazer dependência nenhuma.
     Guarda cor: uma `base` por cor da paleta e cada peça aponta a sua com
     pindex. É o que os fatiadores leem para atribuir filamento por região.
     Devolve uma Promise (a compressão é assíncrona).
     ======================================================================= */
  var CRCT = null;
  function crc32(b) {
    if (!CRCT) {
      CRCT = new Uint32Array(256);
      for (var n = 0; n < 256; n++) {
        var c = n;
        for (var k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        CRCT[n] = c >>> 0;
      }
    }
    var r = 0xffffffff;
    for (var i = 0; i < b.length; i++) r = CRCT[(r ^ b[i]) & 0xff] ^ (r >>> 8);
    return (r ^ 0xffffffff) >>> 0;
  }
  function bytes(str) { return new TextEncoder().encode(str); }

  function deflateRaw(u8) {
    if (typeof CompressionStream === 'undefined') return Promise.resolve(null);
    var st = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Response(st).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }

  function zipar(entradas) {
    var partes = [], centrais = [], off = 0, i = 0;
    function proxima() {
      if (i >= entradas.length) return Promise.resolve();
      var e = entradas[i++], nome = bytes(e.nome), crc = crc32(e.dados);
      return deflateRaw(e.dados).then(function (comp) {
        var metodo = 8;
        if (!comp || comp.length >= e.dados.length) { comp = e.dados; metodo = 0; }
        var lh = new Uint8Array(30 + nome.length), dv = new DataView(lh.buffer);
        dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0, true);
        dv.setUint16(8, metodo, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true);
        dv.setUint32(14, crc, true); dv.setUint32(18, comp.length, true);
        dv.setUint32(22, e.dados.length, true);
        dv.setUint16(26, nome.length, true); dv.setUint16(28, 0, true);
        lh.set(nome, 30);

        var cd = new Uint8Array(46 + nome.length), cv = new DataView(cd.buffer);
        cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
        cv.setUint16(8, 0, true); cv.setUint16(10, metodo, true);
        cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true);
        cv.setUint32(16, crc, true); cv.setUint32(20, comp.length, true);
        cv.setUint32(24, e.dados.length, true);
        cv.setUint16(28, nome.length, true);
        cv.setUint32(42, off, true);
        cd.set(nome, 46);

        partes.push(lh, comp); centrais.push(cd);
        off += lh.length + comp.length;
        return proxima();
      });
    }
    return proxima().then(function () {
      var tamC = 0, n;
      for (n = 0; n < centrais.length; n++) tamC += centrais[n].length;
      var eo = new Uint8Array(22), ev = new DataView(eo.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, centrais.length, true); ev.setUint16(10, centrais.length, true);
      ev.setUint32(12, tamC, true); ev.setUint32(16, off, true);
      var total = off + tamC + 22, buf = new Uint8Array(total), pos = 0;
      for (n = 0; n < partes.length; n++) { buf.set(partes[n], pos); pos += partes[n].length; }
      for (n = 0; n < centrais.length; n++) { buf.set(centrais[n], pos); pos += centrais[n].length; }
      buf.set(eo, pos);
      return buf.buffer;
    });
  }

  var CT = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/>' +
    '<Default Extension="config" ContentType="text/xml"/>' +
    '</Types>';
  var RELS = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rel0" Target="/3D/3dmodel.model" ' +
    'Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>';

  // 5 casas, não 3: perto do centro os nós vizinhos ficam a menos de 0,0005 mm
  // um do outro na qualidade máxima. Com 3 casas eles colidiam, virando
  // triângulo degenerado e aresta não-manifold no arquivo exportado.
  function num(v) { return String(Math.round(v * 1e5) / 1e5); }
  function corHex(c) {
    var h = (c || '#808080').replace('#', '').toUpperCase();
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return '#' + h.slice(0, 6) + 'FF';
  }

  /* -------------------------------------------------------------------------
     Escreve um <object> com malha própria, compactando os vértices usados.
     ------------------------------------------------------------------------- */
  function objetoXML(vx, nv, idx, tris, id, pindex, buf, solta) {
    var usado = new Uint8Array(nv), novo = new Int32Array(nv), i, k;
    for (i = 0; i < nv; i++) novo[i] = -1;
    for (i = 0; i < tris * 3; i++) usado[idx[i]] = 1;
    var n = 0;
    for (i = 0; i < nv; i++) if (usado[i]) novo[i] = n++;

    buf.push('<object id="' + id + '" type="model" pid="1" pindex="' + pindex + '">\n<mesh>\n<vertices>\n');
    for (i = 0; i < nv; i++) {
      if (!usado[i]) continue;
      buf.push('<vertex x="' + num(vx[i * 3]) + '" y="' + num(vx[i * 3 + 1]) + '" z="' + num(vx[i * 3 + 2]) + '"/>\n');
      if (buf.length > 40000) solta();
    }
    buf.push('</vertices>\n<triangles>\n');
    for (i = 0; i < tris; i++) {
      k = i * 3;
      buf.push('<triangle v1="' + novo[idx[k]] + '" v2="' + novo[idx[k + 1]] + '" v3="' + novo[idx[k + 2]] + '"/>\n');
      if (buf.length > 40000) solta();
    }
    buf.push('</triangles>\n</mesh>\n</object>\n');
  }

  /* -------------------------------------------------------------------------
     PERFIL DE PROJETO DO BAMBU STUDIO

     O fatiador só adota as cores do arquivo se ele for um PROJETO do Bambu, e
     isso tem duas condições, ambas medidas por reexportação no CLI:

       1. o <metadata name="Application"> tem que ser "BambuStudio-<versão>";
          com qualquer outro nome o Metadata/project_settings.config é lido e
          descartado (o volume continua indo para o slot N do usuário, com a
          cor que ele tiver lá — foi essa a causa das cores trocadas);
       2. o project_settings.config tem que estar COMPLETO. Uma config só com
          filament_colour/type/settings_id é aceita pelo parser e ignorada na
          hora de montar os presets — testado no app, os slots não mudaram.

     Daí este molde: o despejo do próprio Bambu Studio 02.08.02.61 para
     Bambu Lab H2C bico 0.4 + 0.20mm Standard + Bambu PLA Basic. Abrindo em
     outra impressora o Bambu substitui os presets e mantém as cores.

     ⚠️ O molde tem que sair de presets RESOLVIDOS. Os .json do sistema só
     trazem as chaves que sobrescrevem o pai (`inherits`) e os gcodes vêm por
     `include`; passando o arquivo cru para o CLI, tudo o que não estava nele
     cai no padrão do Slic3r — foi assim que o molde antigo saiu com
     printable_height 100, extruder_printable_height ["0"], gcode genérico e
     UMA variante de bico. Receita de regerar na seção 7 do MANDALA-CLOISONNE.

     O molde tem UM filamento, e esse filamento tem V variantes de extrusor
     (`filament_extruder_variant`; V = 3 no H2C). `projetoBambu` replica o
     bloco por cor da paleta — as chaves replicáveis estão em PERFIL_REPETE,
     levantadas comparando este molde com um projeto real de 8 filamentos.
     É só a camada de materiais: nenhuma coordenada passa por aqui.

  var MAQUINAS = [['h2c', 'H2C'], ['a1', 'A1'], ['p1s', 'P1S'], ['x1c', 'X1 Carbon']];
  /* molde completo de uma máquina: cópia do H2C com a delta aplicada por cima */
  function perfilDe(maq) {
    var base = JSON.parse(JSON.stringify(PERFIL_BAMBU));
    var d = PERFIS_MAQUINA[maq] || {}, k;
    for (k in d) base[k] = d[k];
    return base;
  }

  /* ---- centro da mesa, lido do perfil (printable_area: "XxY" por canto) ----
     Como projeto, o Bambu respeita a coordenada do <item> em vez de arranjar
     sozinho — sem esta translação a peça abre centrada em (0,0), que é o canto
     frontal esquerdo, com três quartos dela fora da mesa. */
  function centroMesa(perfil) {
    var a = (perfil || PERFIL_BAMBU).printable_area || [], i, x = [], y = [];
    for (i = 0; i < a.length; i++) {
      var p = String(a[i]).split('x');
      if (p.length === 2) { x.push(parseFloat(p[0])); y.push(parseFloat(p[1])); }
    }
    if (!x.length) return [0, 0];
    return [(Math.min.apply(null, x) + Math.max.apply(null, x)) / 2,
            (Math.min.apply(null, y) + Math.max.apply(null, y)) / 2];
  }

  /* ---- caixa imprimível comum a TODOS os extrusores ----
     Numa máquina de dois bicos cada extrusor alcança um retângulo diferente
     (no H2C o 1 vai de x=0 a 325 e o 2 de x=25 a 330). O que vale para a torre
     de purga é a interseção: fora dela o fatiador aborta com "Found G-code in
     unprintable area of multi-extruder printers". */
  function caixaComum(perfil) {
    perfil = perfil || PERFIL_BAMBU;
    var a = perfil.extruder_printable_area || [], i, j, cx, p;
    var lo = [-1e9, -1e9], hi = [1e9, 1e9], achou = false;
    for (i = 0; i < a.length; i++) {
      cx = String(a[i]).split(',');
      var x = [], y = [];
      for (j = 0; j < cx.length; j++) {
        p = cx[j].split('x');
        if (p.length === 2) { x.push(parseFloat(p[0])); y.push(parseFloat(p[1])); }
      }
      if (!x.length) continue;
      achou = true;
      lo[0] = Math.max(lo[0], Math.min.apply(null, x));
      lo[1] = Math.max(lo[1], Math.min.apply(null, y));
      hi[0] = Math.min(hi[0], Math.max.apply(null, x));
      hi[1] = Math.min(hi[1], Math.max.apply(null, y));
    }
    if (achou) return { lo: lo, hi: hi };
    // sem extruder_printable_area, cai na mesa inteira
    var b = perfil.printable_area || [], X = [], Y = [];
    for (i = 0; i < b.length; i++) {
      p = String(b[i]).split('x');
      if (p.length === 2) { X.push(parseFloat(p[0])); Y.push(parseFloat(p[1])); }
    }
    if (!X.length) return { lo: [0, 0], hi: [0, 0] };
    return { lo: [Math.min.apply(null, X), Math.min.apply(null, Y)],
             hi: [Math.max.apply(null, X), Math.max.apply(null, Y)] };
  }

  /* ---- canto da torre de purga ----
     O molde vem com o 15/220 padrão do fatiador, que no H2C cai por fora do
     alcance do segundo extrusor (x < 25). Aqui a torre vai ATRÁS da peça
     (a mandala é um disco centrado na mesa), centrada em x, e grampeada
     dentro da caixa comum. */
  function torrePurga(diam, perfil) {
    perfil = perfil || PERFIL_BAMBU;
    var c = caixaComum(perfil), mesa = centroMesa(perfil);
    var w = parseFloat(perfil.prime_tower_width) || 60;

    var x = mesa[0] - w / 2, y = mesa[1] + R + folga;
    x = clamp(x, c.lo[0] + 2, Math.max(c.lo[0] + 2, c.hi[0] - w - 2));
    y = clamp(y, c.lo[1] + 2, Math.max(c.lo[1] + 2, c.hi[1] - w - 2));
    return [x, y];
  }

  /* ---- project_settings.config com uma entrada de filamento por cor ----
     O molde descreve UM filamento com V variantes de extrusor. Replicar por
     cor é mais que repetir array de tamanho 1:

       - PERFIL_REPETE lista as chaves "por filamento"; o bloco do molde
         (1 ou V entradas) se repete uma vez por cor. Chave de fora da lista
         não é por filamento e replicá-la corromperia o perfil;
       - `filament_self_index` diz de qual filamento é cada entrada de variante:
         V entradas com "1", V com "2", ... Deixá-lo todo "1" faz o fatiador
         achar que os filamentos 2..N não têm variante nenhuma e abortar com
         "could not found extruder_type ... / No valid nozzle found";
       - `flush_volumes_matrix` é um bloco N×N POR BICO (bicos*N*N no total) e
         `flush_volumes_vector` é 2N. Sair com o 4×4 do molde dá
         "Flush volumes matrix do not match to the correct size!";
       - `extruder_nozzle_stats` ("<tipo>#<slots>" por extrusor) vem da
         máquina; sem ele o agrupador de filamentos não acha bico válido;

      v = cfg[PERFIL_REPETE[k]];
      if (!(v instanceof Array) || !v.length) continue;
      a = [];
      for (i = 0; i < N; i++) for (j = 0; j < v.length; j++) a.push(v[j]);
      cfg[PERFIL_REPETE[k]] = a;
    }

    // a associação explícita: filamento i+1 é a cor da peça i
    a = [];
    for (i = 0; i < N; i++) a.push(corProjeto(pal[i]));
    cfg.filament_colour = a;

    a = [];
    for (i = 0; i < N; i++) for (j = 0; j < V; j++) a.push(String(i + 1));
    cfg.filament_self_index = a;

    /* A matriz de purga é UM bloco N×N POR BICO, empilhados: o comprimento é
       bicos*N*N, não N*N. Sair com outro tamanho é o
       "Flush volumes matrix do not match to the correct size!" — e o molde vem
       com o 4×4 padrão do Slic3r, que só por acaso batia com quatro cores numa
       máquina de um bico. O vetor é 2*N (volume de carga/descarga por cor) e
       flush_multiplier/_fast têm uma entrada por bico. */
    var B = (cfg.nozzle_diameter || ['0.4']).length || 1;
    a = [];
    for (k = 0; k < B; k++)
      for (i = 0; i < N; i++) for (j = 0; j < N; j++) a.push(i === j ? '0' : '280');
    cfg.flush_volumes_matrix = a;
    a = [];
    for (i = 0; i < 2 * N; i++) a.push('140');
    cfg.flush_volumes_vector = a;
    a = []; for (i = 0; i < B; i++) a.push('1');
    cfg.flush_multiplier = a;
    a = []; for (i = 0; i < B; i++) a.push('1.2');
    cfg.flush_multiplier_fast = a;

    var tipos = cfg.nozzle_volume_type || [], slots = cfg.extruder_max_nozzle_count || [];

    for (i = 0; i < N + 2; i++) a.push('');
    cfg.inherits_group = a;
    cfg.different_settings_to_system = a.slice();

    cfg.wipe_tower_x = [String(t[0])];
    cfg.wipe_tower_y = [String(t[1])];

    return JSON.stringify(cfg, null, 4);
  }
